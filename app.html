<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maria Hair — Hair style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241A28; --plum:#5B2F52; --plum-soft:#7E4A73; --brass:#B4832F; --brass-soft:#E8D3A9;
  --chalk:#FBF7F6; --paper:#FFFFFF; --mist:#EFE5E9; --line:#E2D4DA; --muted:#7B6C77;
  --teal:#2F6F62; --rose:#A8525C; --amber:#B5772B;
  --bg:var(--chalk); --surface:var(--paper); --text:var(--ink); --dim:var(--muted); --border:var(--line);
  --shadow:0 1px 2px rgba(36,26,40,.05), 0 8px 24px -16px rgba(36,26,40,.35);
  --r:14px; --r-sm:9px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#191320; --surface:#221A29; --text:#F4ECF1; --dim:#A798A6; --border:#38293C;
  --mist:#2C2133; --plum:#C79BBC; --plum-soft:#A9769E; --brass:#D9AE61; --brass-soft:#4A3A1E;
  --teal:#67B29F; --rose:#D98A93; --amber:#DBA365;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --bg:#191320; --surface:#221A29; --text:#F4ECF1; --dim:#A798A6; --border:#38293C;
  --mist:#2C2133; --plum:#C79BBC; --plum-soft:#A9769E; --brass:#D9AE61; --brass-soft:#4A3A1E;
  --teal:#67B29F; --rose:#D98A93; --amber:#DBA365;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--text);
  font-family:Karla,"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Fraunces,Georgia,"Times New Roman",serif; font-weight:600; margin:0; line-height:1.15; letter-spacing:-.01em}
h1{font-size:1.65rem} h2{font-size:1.22rem} h3{font-size:1.02rem}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none; padding:0}
a{color:var(--plum)}
::selection{background:var(--brass-soft); color:var(--ink)}
:focus-visible{outline:2.5px solid var(--brass); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ---------- shell ---------- */
.app{display:flex; min-height:100vh}
.side{display:none}
.main{flex:1; min-width:0; padding:0 0 92px}
.wrap{max-width:1180px; margin:0 auto; padding:0 16px}

.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--bg);
  border-bottom:1px solid var(--border);
}
.topbar-in{max-width:1180px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px; min-height:58px}
.topbar h1{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.brandmark{
  width:34px; height:34px; border-radius:11px; color:#fff;
  background:linear-gradient(135deg, var(--g1, var(--plum)), var(--g2, var(--brass)));
  display:grid; place-items:center; font-family:Fraunces,serif; font-weight:700; font-size:16px; flex:none;
}


/* ---------- bottom nav (mobile) ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40; display:flex;
  background:var(--surface); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.tabbar button{flex:1; padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--dim); font-size:.63rem; font-weight:600; letter-spacing:.01em}
.tabbar button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--plum)}
.tabbar button[aria-current="page"] svg{stroke-width:2.1}

/* ---------- cards & structure ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow)}
.pad{padding:16px}
.sec{margin-top:22px}
.sec-head{display:flex; align-items:baseline; gap:10px; margin-bottom:10px}
.sec-head h2{flex:1}
.stack{display:flex; flex-direction:column; gap:10px}
.row{display:flex; gap:10px; align-items:center}
.row-tight{display:flex; gap:6px; align-items:center}
.spread{display:flex; justify-content:space-between; align-items:center; gap:10px}
.grow{flex:1; min-width:0}
.dim{color:var(--dim)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.num{font-family:Fraunces,serif; font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.trunc{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.center{text-align:center}
hr.rule{border:none; border-top:1px solid var(--border); margin:14px 0}

/* stat strip */
.stats{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
.stat{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:13px 14px;
  position:relative; overflow:hidden}
.stat::before{content:""; position:absolute; left:0; top:0; right:0; height:3px; background:var(--sc, var(--plum))}
.stat .k{font-size:.75rem; color:var(--dim); font-weight:600}
.stat .v{font-size:1.5rem; margin-top:2px}
.stat .v.money{color:var(--brass)}
/* tiles that open something */
button.stat.tap{font:inherit; color:inherit; text-align:left; cursor:pointer; width:100%;
  transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease}
button.stat.tap:hover{border-color:var(--sc, var(--plum)); box-shadow:var(--shadow)}
button.stat.tap:active{transform:scale(.985)}
.stat .k{display:flex; align-items:center; gap:4px}
.stat-chev{width:14px; height:14px; margin-left:auto; stroke:var(--dim); fill:none; stroke-width:2; opacity:.7}

/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  min-height:46px; padding:0 17px; border-radius:11px; font-weight:600; font-size:.94rem;
  background:var(--mist); color:var(--text); border:1px solid transparent; transition:transform .06s ease;
}
.btn:active{transform:scale(.975)}
.btn svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.btn.primary{background:var(--plum); color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1B1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#1B1420}}
.btn.ghost{background:transparent; border-color:var(--border)}
.btn.danger{background:transparent; border-color:var(--border); color:var(--rose)}
.btn.sm{min-height:36px; padding:0 12px; font-size:.84rem; border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45; pointer-events:none}
.iconbtn{width:42px; height:42px; border-radius:11px; display:grid; place-items:center; color:var(--text); background:var(--mist); flex:none}
.iconbtn.plain{background:transparent}
.iconbtn svg{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

.quick{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
.quick button{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:13px 8px;
  display:flex; flex-direction:column; align-items:center; gap:7px; font-size:.78rem; font-weight:600; box-shadow:var(--shadow);
}
.quick .qi{width:40px; height:40px; border-radius:13px; display:grid; place-items:center;
  background:color-mix(in srgb, var(--qc, var(--plum)) 14%, transparent); color:var(--qc, var(--plum))}
.quick svg{width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}

/* today, at the top of the dashboard */
.hero{margin:16px 0 4px; padding:20px 20px 18px; border-radius:20px; color:#fff; position:relative; overflow:hidden;
  background:linear-gradient(125deg, var(--g1, var(--plum)) 0%, var(--g2, var(--brass)) 100%);
  box-shadow:0 14px 32px -18px var(--g1, var(--plum))}
.hero::after{content:""; position:absolute; right:-40px; top:-60px; width:200px; height:200px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 70%); pointer-events:none}
.hero .hd{font-size:.82rem; font-weight:700; opacity:.95; letter-spacing:.01em}
.hero h1{color:#fff; margin-top:4px; font-size:1.75rem}
.hero .hn{font-size:.86rem; margin-top:7px; opacity:.95}
.hero .hn b{font-weight:700}

/* colour-scheme picker */
.swatches{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:8px}
.swatch{border:2px solid var(--border); border-radius:14px; padding:8px; background:var(--surface); text-align:left;
  display:flex; flex-direction:column; gap:7px; font-size:.78rem; font-weight:700}
.swatch i{display:block; height:30px; border-radius:9px}
.swatch[aria-pressed="true"]{border-color:var(--plum); box-shadow:0 0 0 3px color-mix(in srgb, var(--plum) 22%, transparent)}

/* chips / status */
.chip{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:.72rem; font-weight:700; background:var(--mist); color:var(--dim)}
.chip .dot{width:7px; height:7px; border-radius:99px; background:currentColor}
.st-scheduled{color:var(--plum); background:color-mix(in srgb,var(--plum) 13%,transparent)}
.st-confirmed{color:var(--teal); background:color-mix(in srgb,var(--teal) 15%,transparent)}
.st-completed{color:var(--brass); background:color-mix(in srgb,var(--brass) 16%,transparent)}
.st-cancelled{color:var(--rose); background:color-mix(in srgb,var(--rose) 14%,transparent)}
.st-noshow{color:var(--amber); background:color-mix(in srgb,var(--amber) 16%,transparent)}

/* avatar */
/* every client gets their own colour, worked out from their name */
.av{width:42px; height:42px; border-radius:99px; flex:none; display:grid; place-items:center; font-weight:700; font-size:.86rem;
  background:hsl(var(--avh, 330) 85% 91%); color:hsl(var(--avh, 330) 60% 28%); overflow:hidden; letter-spacing:.02em}
:root[data-theme="dark"] .av{background:hsl(var(--avh, 330) 38% 24%); color:hsl(var(--avh, 330) 90% 80%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{background:hsl(var(--avh, 330) 38% 24%); color:hsl(var(--avh, 330) 90% 80%)}}
.av img{width:100%; height:100%; object-fit:cover}
.av.lg{width:64px; height:64px; font-size:1.2rem}
.av.sm{width:32px; height:32px; font-size:.72rem}

/* list rows */
.list{display:flex; flex-direction:column}
.item{display:flex; gap:12px; align-items:center; padding:12px 14px; border-bottom:1px solid var(--border); text-align:left; width:100%; background:none}
.item:last-child{border-bottom:none}
.item:active{background:var(--mist)}
.item .nm{font-weight:600}
.item > svg{width:18px; height:18px; stroke:var(--dim); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* timeline (today) */
.tl{position:relative; padding-left:64px}
.tl .slot{position:relative; padding:0 0 12px}
.tl .time{position:absolute; left:-64px; width:54px; text-align:right; font-size:.78rem; font-weight:700; color:var(--dim); padding-top:13px; font-variant-numeric:tabular-nums}
.tl .slot::before{content:""; position:absolute; left:-18px; top:20px; width:9px; height:9px; border-radius:99px; background:var(--plum); box-shadow:0 0 0 3px var(--bg)}
.tl .slot::after{content:""; position:absolute; left:-14.5px; top:29px; bottom:-2px; width:2px; background:var(--border)}
.tl .slot:last-child::after{display:none}
.tl .blk{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--plum); border-radius:var(--r); padding:12px 13px; box-shadow:var(--shadow); width:100%; text-align:left; display:block}
.tl .blk.s-confirmed{border-left-color:var(--teal)}
.tl .blk.s-completed{border-left-color:var(--brass)}
.tl .blk.s-cancelled{border-left-color:var(--rose); opacity:.6}
.tl .blk.s-noshow{border-left-color:var(--amber); opacity:.75}

/* empty state */
.empty{padding:30px 18px; text-align:center; color:var(--dim)}
.empty h3{color:var(--text); margin-bottom:5px}
.empty .btn{margin-top:14px}

/* ---------- forms ---------- */
.field{display:block; margin-bottom:13px}
.field > .lab{display:block; font-size:.79rem; font-weight:700; color:var(--dim); margin-bottom:5px}
.inp{
  width:100%; min-height:46px; padding:11px 13px; background:var(--bg); color:var(--text);
  border:1.5px solid var(--border); border-radius:11px; appearance:none;
}
textarea.inp{min-height:88px; resize:vertical; line-height:1.5}
select.inp{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' fill='none' stroke='%237B6C77' stroke-width='2' stroke-linecap='round'><path d='M6 8l4 4 4-4'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; padding-right:34px}
.inp:focus{border-color:var(--plum); outline:none}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 11px}
.check{display:flex; gap:10px; align-items:flex-start; padding:11px 0; cursor:pointer}
.check input{width:21px; height:21px; accent-color:var(--plum); flex:none; margin:1px 0 0}
.seg{display:flex; background:var(--mist); border-radius:11px; padding:3px; gap:3px}
.seg button{flex:1; padding:9px 6px; border-radius:8px; font-size:.84rem; font-weight:600; color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--text); box-shadow:var(--shadow)}
.picks{display:flex; flex-wrap:wrap; gap:7px}
.pick{padding:8px 12px; border-radius:99px; border:1.5px solid var(--border); font-size:.84rem; font-weight:600; background:var(--surface)}
.pick[aria-pressed="true"]{background:var(--plum); color:#fff; border-color:var(--plum)}
:root[data-theme="dark"] .pick[aria-pressed="true"]{color:#1B1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pick[aria-pressed="true"]{color:#1B1420}}
.err{color:var(--rose); font-size:.78rem; font-weight:600; margin-top:4px}
.inp.bad{border-color:var(--rose)}

.search{position:relative}
.search .inp{padding-left:38px}
.search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke:var(--dim); fill:none; stroke-width:2}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(28,18,30,.5); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s ease}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--surface);
  border-radius:20px 20px 0 0; max-height:92vh; display:flex; flex-direction:column;
  transform:translateY(102%); transition:transform .22s cubic-bezier(.2,.8,.3,1), visibility 0s linear .22s;
  padding-bottom:env(safe-area-inset-bottom,0px); box-shadow:0 -10px 40px -18px rgba(0,0,0,.5);
  /* a closed sheet must never sit over the page and swallow taps */
  visibility:hidden; pointer-events:none;
}
.sheet.on{transform:translateY(0); visibility:visible; pointer-events:auto; transition-delay:0s}
.sheet-head{display:flex; align-items:center; gap:10px; padding:14px 16px 10px; border-bottom:1px solid var(--border)}
.sheet-head h2{flex:1; min-width:0}
.sheet-body{overflow:auto; -webkit-overflow-scrolling:touch; padding:16px; flex:1}
.sheet-foot{padding:12px 16px 16px; border-top:1px solid var(--border); display:flex; gap:9px}
.sheet-foot .btn{flex:1}
.grab{width:38px; height:4px; border-radius:99px; background:var(--border); margin:8px auto 0}

/* toast */
.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,16px);
  background:var(--ink); color:#FBF7F6; padding:11px 17px; border-radius:99px; font-size:.86rem; font-weight:600;
  z-index:90; opacity:0; pointer-events:none; transition:all .2s ease; max-width:88vw; text-align:center}
:root[data-theme="dark"] .toast{background:#F4ECF1; color:#191320}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:#F4ECF1; color:#191320}}
.toast.on{opacity:1; transform:translate(-50%,0)}

/* ---------- calendar ---------- */
.cal-head{display:flex; align-items:center; gap:8px; margin-bottom:12px}
.cal-head .t{flex:1; font-family:Fraunces,serif; font-weight:600; font-size:1.1rem}
.month{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.month .dow{text-align:center; font-size:.68rem; font-weight:700; color:var(--dim); padding:4px 0}
.month .day{aspect-ratio:1/1.06; border-radius:10px; background:var(--surface); border:1px solid var(--border);
  padding:4px 3px 3px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.8rem; font-weight:600}
.month .day.off{opacity:.38}
.month .day.today{border-color:var(--plum); box-shadow:inset 0 0 0 1px var(--plum)}
.month .day .dn{width:24px; height:24px; line-height:24px; text-align:center; border-radius:99px; flex:none}
.month .day.sel{background:color-mix(in srgb,var(--plum) 10%,var(--surface)); border-color:var(--plum); box-shadow:inset 0 0 0 1.5px var(--plum)}
.month .day.sel .dn{background:var(--plum); color:#fff}
:root[data-theme="dark"] .month .day.sel .dn{color:#1B1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .month .day.sel .dn{color:#1B1420}}
.month .dots{display:flex; gap:2px; flex-wrap:wrap; justify-content:center}
.month .dots i{width:5px; height:5px; border-radius:99px; background:var(--plum)}
.month .cnt{display:none}
/* on a tablet or desktop the cells are big enough to show who is booked */
.month .evs{display:none}
.mev{display:block; font-size:.68rem; font-weight:600; line-height:1.25; padding:2px 5px; border-radius:6px; text-align:left;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text);
  border-left:3px solid var(--plum); background:color-mix(in srgb,var(--plum) 12%,var(--surface))}
.mev.s-confirmed{border-left-color:var(--teal); background:color-mix(in srgb,var(--teal) 14%,var(--surface))}
.mev.s-completed{border-left-color:var(--brass); background:color-mix(in srgb,var(--brass) 16%,var(--surface))}
.mev.s-noshow{border-left-color:var(--amber); background:color-mix(in srgb,var(--amber) 15%,var(--surface))}
.mev.more{border-left-color:transparent; background:none; color:var(--dim); font-weight:600}
@media (min-width:860px){
  .month{gap:6px}
  .month .day{aspect-ratio:auto; min-height:104px; align-items:stretch; padding:6px; gap:4px}
  .month .day .dn{align-self:flex-end}
  .month .dots{display:none}
  .month .evs{display:flex; flex-direction:column; gap:2px; width:100%}
}

.grid-cal{display:grid; border:1px solid var(--border); border-radius:var(--r); overflow:hidden; background:var(--surface); position:relative}
.gc-head{display:grid; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:2}
.gc-head div{padding:7px 3px; text-align:center; font-size:.72rem; font-weight:700; border-left:1px solid var(--border)}
.gc-head div:first-child{border-left:none}
.gc-head .is-today{color:var(--plum)}
.gc-body{position:relative; overflow:auto; max-height:62vh}
.gc-cols{display:grid; position:relative}
.gc-col{position:relative; border-left:1px solid var(--border)}
.gc-col:first-child{border-left:none}
.gc-hour{height:56px; border-top:1px solid var(--border); position:relative}
.gc-hour:first-child{border-top:none}
.gc-gut{position:sticky; left:0; z-index:1; background:var(--surface); border-right:1px solid var(--border)}
.gc-gut .gc-hour{font-size:.66rem; color:var(--dim); font-weight:700; text-align:right; padding:2px 5px 0}
.ev{position:absolute; left:2px; right:2px; border-radius:7px; padding:3px 5px; font-size:.68rem; line-height:1.24;
  overflow:hidden; background:color-mix(in srgb,var(--plum) 15%,var(--surface)); border-left:3px solid var(--plum); color:var(--text); text-align:left}
.ev b{font-weight:700; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ev.s-confirmed{background:color-mix(in srgb,var(--teal) 15%,var(--surface)); border-left-color:var(--teal)}
.ev.s-completed{background:color-mix(in srgb,var(--brass) 16%,var(--surface)); border-left-color:var(--brass)}
.ev.s-cancelled{background:color-mix(in srgb,var(--rose) 12%,var(--surface)); border-left-color:var(--rose); opacity:.65; text-decoration:line-through}
.ev.s-noshow{background:color-mix(in srgb,var(--amber) 15%,var(--surface)); border-left-color:var(--amber)}
.ev.drag{opacity:.9; box-shadow:0 8px 20px -6px rgba(0,0,0,.45); z-index:5; cursor:grabbing}
.closed{position:absolute; left:0; right:0; background:repeating-linear-gradient(45deg,transparent,transparent 5px,var(--mist) 5px,var(--mist) 10px); pointer-events:none}
.nowline{position:absolute; left:0; right:0; height:2px; background:var(--rose); z-index:4}
.nowline::before{content:""; position:absolute; left:-1px; top:-3px; width:8px; height:8px; border-radius:99px; background:var(--rose)}

/* charts */
.bars{display:flex; flex-direction:column; gap:8px}
.bar-row{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center}
.bar-row .lab{font-size:.84rem; font-weight:600}
.bar-row .amt{font-size:.84rem; font-weight:700; font-variant-numeric:tabular-nums}
.bar-track{grid-column:1/-1; height:8px; border-radius:99px; background:var(--mist); overflow:hidden}
.bar-fill{height:100%; border-radius:99px; background:var(--plum)}
.spark{display:flex; align-items:flex-end; gap:4px; height:92px}
.spark .col{flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; justify-content:flex-end; height:100%}
.spark .col i{width:100%; max-width:34px; border-radius:5px 5px 0 0; background:var(--brass); display:block; min-height:2px}
.spark .col span{font-size:.64rem; color:var(--dim); font-weight:700}

/* photos */
.pgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px}
@media (min-width:640px){ .pgrid{grid-template-columns:repeat(4,1fr); gap:8px} }
.pcell{position:relative; aspect-ratio:1; border-radius:10px; overflow:hidden; background:var(--mist); border:1px solid var(--border); padding:0}
.pcell img{width:100%; height:100%; object-fit:cover; display:block}
.pcell .ptag{position:absolute; left:4px; bottom:4px; font-size:.6rem; font-weight:800; padding:2px 6px; border-radius:99px;
  background:rgba(28,18,30,.72); color:#fff; letter-spacing:.02em}
.pcell.pending{display:grid; place-items:center; color:var(--dim); font-size:.68rem; font-weight:700}
.pfull{width:100%; border-radius:12px; display:block; background:var(--mist); margin-bottom:14px}
.pdrop{border:1.5px dashed var(--border); border-radius:var(--r); padding:22px 16px; text-align:center; color:var(--dim)}

/* before & after */
.shoot{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px}
.shoot button{min-height:84px; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  font-weight:700; font-size:.95rem; color:#fff; border:none}
.shoot button svg{width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.shoot .sb{background:linear-gradient(135deg, #3b3346, #5b5166)}
.shoot .sa{background:linear-gradient(135deg, var(--g1, var(--plum)), var(--g2, var(--brass)))}
.shoot small{font-size:.7rem; font-weight:600; opacity:.9}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:3px; border-radius:14px; overflow:hidden; background:var(--border);
  border:1px solid var(--border); width:100%; padding:0; position:relative}
.pair img{width:100%; aspect-ratio:4/5; object-fit:cover; display:block; background:var(--mist)}
.pair .pl{position:absolute; bottom:8px; font-size:.64rem; font-weight:800; padding:3px 8px; border-radius:99px; color:#fff; background:rgba(20,12,22,.72)}
.pair .pl.a{left:calc(50% + 8px); background:var(--plum)}
.pair .pl.b{left:8px}
.pairmeta{display:flex; justify-content:space-between; gap:8px; font-size:.78rem; margin:6px 2px 14px}
.pairmeta b{font-weight:700}
.missing{display:grid; place-items:center; aspect-ratio:4/5; background:var(--mist); color:var(--dim); font-size:.72rem; font-weight:700; text-align:center; padding:8px}
.cmp{position:relative; width:100%; aspect-ratio:4/5; border-radius:14px; overflow:hidden; background:var(--mist);
  touch-action:none; user-select:none; -webkit-user-select:none; cursor:ew-resize}
.cmp img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; pointer-events:none}
.cmp .cb{clip-path:inset(0 50% 0 0)}
.cmp .ch{position:absolute; top:0; bottom:0; left:50%; width:3px; margin-left:-1.5px; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.cmp .ch::after{content:""; position:absolute; top:50%; left:50%; width:38px; height:38px; margin:-19px 0 0 -19px; border-radius:99px;
  background:#fff; box-shadow:0 4px 14px rgba(0,0,0,.3)}
.cmp .ch i{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:1; font-style:normal; font-size:.8rem; color:#333; font-weight:800; letter-spacing:-1px}
.cmp .lb{position:absolute; top:10px; font-size:.68rem; font-weight:800; padding:4px 9px; border-radius:99px; color:#fff; background:rgba(20,12,22,.72)}
.cmp .lb.l{left:10px} .cmp .lb.r{right:10px; background:var(--plum)}
.pcell.pending{display:grid; place-items:center; color:var(--dim); font-size:.68rem; font-weight:700; animation:pulse 1.4s ease-in-out infinite}

/* misc */
.badge{background:var(--rose); color:#fff; border-radius:99px; font-size:.64rem; font-weight:800; padding:1px 6px; min-width:17px; text-align:center}
.warnbar{background:color-mix(in srgb,var(--amber) 14%,transparent); border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);
  color:var(--text); border-radius:var(--r); padding:11px 13px; font-size:.85rem}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); overflow-x:auto; margin-bottom:14px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 12px; font-size:.87rem; font-weight:600; color:var(--dim); border-bottom:2.5px solid transparent; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--plum); border-bottom-color:var(--plum)}
.kv{display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:.9rem}
.kv dt{color:var(--dim); font-weight:600}
.kv dd{margin:0; text-align:right; font-weight:600; overflow-wrap:anywhere}
.note{border-left:3px solid var(--brass); padding:9px 0 9px 11px; margin-bottom:12px}
.note .meta{font-size:.72rem; color:var(--dim); font-weight:700; margin-bottom:3px}
.note p{white-space:pre-wrap; font-size:.9rem}
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch}
.sk{background:var(--mist); border-radius:8px; height:14px; animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}

/* desktop */
@media (min-width:860px){
  .tabbar{display:none}
  .main{padding-bottom:28px}
  .side{
    display:flex; flex-direction:column; width:228px; flex:none; background:var(--surface);
    border-right:1px solid var(--border); position:sticky; top:0; height:100vh; padding:18px 12px 12px; gap:3px;
  }
  .side .brand{display:flex; align-items:center; gap:10px; padding:0 8px 18px}
  .side .brand .nm{font-family:Fraunces,serif; font-weight:600; font-size:1.02rem; line-height:1.15}
  .side nav{display:flex; flex-direction:column; gap:2px; overflow:auto}
  .side nav button{display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:10px; font-size:.92rem; font-weight:600; color:var(--dim); text-align:left}
  .side nav button svg{width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}
  .side nav button:hover{background:var(--mist); color:var(--text)}
  .side nav button[aria-current="page"]{background:color-mix(in srgb, var(--plum) 12%, transparent); color:var(--plum)}
  .stats{grid-template-columns:repeat(4,1fr)}
  .quick{grid-template-columns:repeat(3,1fr); max-width:520px}
  .cols{display:grid; grid-template-columns:1.35fr 1fr; gap:18px; align-items:start}
  .sheet{left:50%; right:auto; bottom:auto; top:50%; width:min(620px,94vw); max-height:88vh;
    border-radius:18px; transform:translate(-50%,-44%) scale(.97); opacity:0;
    transition:transform .18s ease, opacity .18s ease, visibility 0s linear .18s}
  .sheet.on{transform:translate(-50%,-50%) scale(1); opacity:1; transition-delay:0s}
  .grab{display:none}
  .wrap{padding:0 26px}
  .topbar-in{padding:14px 26px}
  .gc-body{max-height:70vh}
  .toast{bottom:28px}
}
@media (min-width:1100px){ .stats{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brandmark" id="brandmark">C</div>
      <div class="nm" id="brandname">Maria Hair</div>
    </div>
    <nav id="sidenav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-in">
        <div class="brandmark" id="mbrand">C</div>
        <h1 id="pagetitle">Today</h1>
        <button class="iconbtn plain" id="themebtn" aria-label="Switch theme">
          <svg viewBox="0 0 24 24"><path d="M12 3v1.5M12 19.5V21M4.2 4.2l1.1 1.1M18.7 18.7l1.1 1.1M3 12h1.5M19.5 12H21M4.2 19.8l1.1-1.1M18.7 5.3l1.1-1.1"/><circle cx="12" cy="12" r="4"/></svg>
        </button>
      </div>

</div>

<nav class="tabbar" id="tabbar" aria-label="Main"></nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheettitle">
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="sheettitle">&nbsp;</h2>
    <button class="iconbtn plain" id="sheetclose" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="sheet-body" id="sheetbody"></div>
  <div class="sheet-foot" id="sheetfoot"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ============================================================
   Chair & Comb — salon manager
   Core: icons, helpers, state, persistence
   ============================================================ */

const I = {
  home:'<path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  users:'<path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7.5" r="3.5"/><path d="M21 20v-1.5a4 4 0 0 0-3-3.87M16.5 4.2a3.5 3.5 0 0 1 0 6.6"/>',
  scissors:'<circle cx="6" cy="6.5" r="2.6"/><circle cx="6" cy="17.5" r="2.6"/><path d="M8.2 7.9L20 18M20 6L8.2 16.1"/>',
  box:'<path d="M21 8.5v7.6a1.6 1.6 0 0 1-.9 1.4l-7.3 3.4a1.6 1.6 0 0 1-1.6 0l-7.3-3.4a1.6 1.6 0 0 1-.9-1.4V8.5"/><path d="M3.4 7.6l7.8-3.5a1.6 1.6 0 0 1 1.6 0l7.8 3.5-8.6 4z"/><path d="M12 11.6V21"/>',
  cash:'<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><circle cx="12" cy="12" r="2.6"/><path d="M6 10v4M18 10v4"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7h-.3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.1-2.8l-.1-.1A2 2 0 1 1 7.2 3.9l.1.1a1.6 1.6 0 0 0 2.7-1.1V2.6a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.3 1.1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  userplus:'<path d="M15 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="8.5" cy="7.5" r="3.5"/><path d="M18 7v6M21 10h-6"/>',
  calplus:'<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  chev:'<path d="M9 5l7 7-7 7"/>',
  left:'<path d="M15 5l-7 7 7 7"/>',
  right:'<path d="M9 5l7 7-7 7"/>',
  phone:'<path d="M5 3h3.5l1.8 4.4-2.2 1.3a12 12 0 0 0 5.2 5.2l1.3-2.2L19 13.5V17a2 2 0 0 1-2.2 2A15.5 15.5 0 0 1 3 5.2 2 2 0 0 1 5 3z"/>',
  mail:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M3 7l9 6 9-6"/>',
  bell:'<path d="M18 9a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16S18 14 18 9z"/><path d="M13.7 19.5a2 2 0 0 1-3.4 0"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12.2a2 2 0 0 0 2 1.8h7a2 2 0 0 0 2-1.8L18.5 7M9 7V4.8A1.8 1.8 0 0 1 10.8 3h2.4A1.8 1.8 0 0 1 15 4.8V7"/>',
  edit:'<path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="M14.5 5.5l4 4"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  send:'<path d="M20.5 3.5L10.5 13.5M20.5 3.5l-6.4 17-3.6-7-7-3.6z"/>',
  warn:'<path d="M12 4.5L2.8 20h18.4z"/><path d="M12 10v4M12 17v.01"/>',
  dl:'<path d="M12 3v12M7.5 11l4.5 4.5 4.5-4.5M4 20h16"/>',
  camera:'<path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.8l1.4-2h4.6l1.4 2h1.8A2.5 2.5 0 0 1 20 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.6"/>',
};
const svg = (k, cls) => '<svg viewBox="0 0 24 24" class="'+(cls||'')+'">'+I[k]+'</svg>';

/* ---------- tiny helpers ---------- */
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clamp = (n,a,b) => Math.max(a, Math.min(b, n));

const pad2 = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const fromISO = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = fromISO(s); d.setDate(d.getDate()+n); return iso(d); };
const dowOf = s => fromISO(s).getDay();
const nowMins = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const whenTS = (dateISO, mins) => { const d = fromISO(dateISO); d.setMinutes(mins); return d.getTime(); };

const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function fmtTime(m){
  m = ((Math.round(m)%1440)+1440)%1440;
  const h = Math.floor(m/60), mm = m%60;
  const ap = h<12 ? 'am':'pm'; const h12 = h%12===0 ? 12 : h%12;
  return h12 + (mm ? ':'+pad2(mm) : '') + ap;
}
function fmtDate(s, style){
  const d = fromISO(s), t = todayISO();
  if (style==='rel'){
    if (s===t) return 'Today';
    if (s===addDays(t,1)) return 'Tomorrow';
    if (s===addDays(t,-1)) return 'Yesterday';
  }
  if (style==='long') return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate();
  if (style==='full') return DOW[d.getDay()]+', '+MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
  return MON[d.getMonth()].slice(0,3)+' '+d.getDate()+(d.getFullYear()!==new Date().getFullYear()?', '+d.getFullYear():'');
}
function relDays(s){
  const a = fromISO(s).getTime(), b = fromISO(todayISO()).getTime();
  return Math.round((a-b)/86400000);
}
function spanText(n){
  if (n < 21) return n + ' day' + (n===1?'':'s');
  const w = Math.round(n/7);
  if (w < 9) return w + ' weeks';
  return Math.round(n/30.4) + ' months';
}
function agoText(s){
  const n = -relDays(s);
  if (n <= 0) return 'today';
  if (n === 1) return 'yesterday';
  return spanText(n) + ' ago';
}
function sinceText(s){
  const n = -relDays(s);
  return n <= 1 ? 'a day' : spanText(n);
}
function money(n){
  const c = (S.settings && S.settings.currency) || '$';
  const v = Math.round((Number(n)||0)*100)/100;
  return c + v.toLocaleString(undefined,{minimumFractionDigits: v%1?2:0, maximumFractionDigits:2});
}
function initials(c){ return ((c.first||'?')[0] + (c.last||'')[0]||'').toUpperCase(); }
function fullName(c){ return c ? ((c.first||'')+' '+(c.last||'')).trim() || 'Unnamed' : 'Unknown client'; }
function telHref(p){ return 'tel:'+String(p||'').replace(/[^0-9+]/g,''); }
function smsHref(p, body){ return 'sms:'+String(p||'').replace(/[^0-9+]/g,'')+(/(iPhone|iPad|Mac)/.test(navigator.userAgent)?'&':'?')+'body='+encodeURIComponent(body); }
function mailHref(e, subj, body){ return 'mailto:'+encodeURIComponent(e||'')+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body); }

/* ---------- state ---------- */
const STATUSES = [
  {id:'scheduled', label:'Scheduled'},
  {id:'confirmed', label:'Confirmed'},
  {id:'completed', label:'Completed'},
  {id:'cancelled', label:'Cancelled'},
  {id:'noshow',    label:'No-show'},
];
const statusLabel = s => (STATUSES.find(x=>x.id===s)||STATUSES[0]).label;

const PAY_METHODS = ['Cash','Card','Venmo','Cash App','Zelle','Other'];

function defaultSettings(){
  const hours = {};
  for (let d=0; d<7; d++) hours[d] = { open: d >= 1 && d <= 6, start: 9*60, end: 18*60, breakStart: 13*60, breakEnd: 14*60, breakOn: false };
  return {
    id:'business', currency:'$', theme:'auto', palette:'fuchsia',
    biz:{ name:'Chair & Comb', stylist:'', phone:'', email:'', address:'', website:'', logo:'' },
    hours, closures:[], slot:15, buffer:0,
    notify:{ sms:true, email:true, confirm:true, night:true, r2:true, rebook:true, birthday:true, r2h:2 },
    birthdayHour:9,
    coupon:{ on:false, type:'percent', value:15, days:30, note:'' },
    nightHour:19,
    autoDefaults:{ nightBefore:true, rebookOn:true, rebookDays:60 },
    followupWeeks:6,
    tpl:{
      confirm_sms:"Hi {first}! Your appointment with {stylist} is confirmed for {dateLong} at {time}. Service: {services}. See you soon!",
      night_sms:"Hi {first}, see you tomorrow at {time} for {services}. Reply here if anything's changed. — {stylist}",
      dayof_sms:"Hi {first}, a reminder about your appointment with {stylist} today at {time}. See you shortly!",
      reschedule_sms:"Hi {first}, your appointment has been moved to {dateLong} at {time}. Service: {services}. Let me know if that doesn't work!",
      cancel_sms:"Hi {first}, your appointment on {dateLong} at {time} has been cancelled. Text me any time to rebook.",
      rebook_sms:"Hi {first}! It's been {since} since your last visit. I'd love to get you back in the chair — text me a day that works. — {stylist}",

      confirm_email_subject:"Your appointment is confirmed",
      confirm_email:"Hi {first},\n\nYour appointment with {stylist} is confirmed.\n\nDate: {dateFull}\nTime: {time}\nService: {services}\nDuration: {duration}\nTotal: {price}\nLocation: {address}\n\nSee you soon!\n{business}\n{phone}",

      night_email_subject:"See you tomorrow at {time}",
      night_email:"Hi {first},\n\nJust a note before tomorrow.\n\nDate: {dateFull}\nTime: {time}\nService: {services}\nLocation: {address}\n\nIf anything's changed, reply to this email or call {phone} and I'll move you.\n\nSee you then!\n{stylist}\n{business}",

      dayof_email_subject:"Your appointment is today at {time}",
      dayof_email:"Hi {first},\n\nA quick reminder that you're booked in today.\n\nTime: {time}\nService: {services}\nLocation: {address}\n\n{business}\n{phone}",

      reschedule_email_subject:"Your appointment has moved",
      reschedule_email:"Hi {first},\n\nYour appointment is now on {dateFull} at {time}.\n\nService: {services}\nLocation: {address}\n\nIf that doesn't work, reply to this email or call {phone}.\n\n{business}",

      cancel_email_subject:"Your appointment has been cancelled",
      cancel_email:"Hi {first},\n\nYour appointment on {dateFull} at {time} has been cancelled.\n\nTo rebook, just reply to this email or call {phone}.\n\n{business}",

      birthday_sms:"Happy birthday, {first}! Hope it's a wonderful one. {couponShort} - {stylist}",
      birthday_email_subject:"Happy birthday, {first}!",
      birthday_email:"Hi {first},\n\nHappy birthday from everyone at {business}! \u{1F389} I hope the year ahead is a great one.\n\n{couponLine}\n\nSee you soon,\n{stylist}",

      rebook_email_subject:"We'd love to see you again",
      rebook_email:"Hi {first},\n\nIt's been {since} since your last visit. I'd love to get you back in the chair — reply with a day that works and I'll hold a spot.\n\n{stylist}\n{business}\n{phone}",
    },
    seeded:false
  };
}

const S = { settings: defaultSettings(), customers:[], services:[], products:[], appts:[], notes:[], msgs:[], photos:[], coupons:[] };
const COLS = ['customers','services','products','appts','notes','msgs'];
const LS = 'chaircomb.v1.';

/* ---------- persistence (this app's own server) ---------- */
/* The browser copy is a cache, so the app opens instantly and still reads
   when the salon wifi drops. The database is the truth. */
function lsSave(kind){
  try { localStorage.setItem(LS+kind, JSON.stringify(kind === 'settings' ? S.settings : S[kind])); } catch(e){}
}
function lsLoadAll(){
  try {
    const st = localStorage.getItem(LS+'settings');
    if (st) S.settings = Object.assign(defaultSettings(), JSON.parse(st));
    COLS.forEach(k => { const v = localStorage.getItem(LS+k); if (v) S[k] = JSON.parse(v) || []; });
  } catch(e){}
}

let INTEGRATIONS = {email:false, sms:false, dryRun:false};
let LASTRUN = null;
let online = true;

async function api(path, opts){
  const res = await fetch(path, Object.assign({
    headers:{'Content-Type':'application/json'}, credentials:'same-origin'
  }, opts || {}));
  if (res.status === 401){ window.location.href = '/login'; throw new Error('signed out'); }
  if (!res.ok){
    let m = '';
    try { m = (await res.json()).error; } catch(e){}
    throw new Error(m || ('The server said ' + res.status));
  }
  return res.status === 204 ? null : res.json();
}

/* Writes go into an outbox so a dropped connection never loses an edit.
   Everything is also mirrored to this browser, so the app still opens and
   reads if the network is down mid-appointment. */
const outbox = [];
let flushing = false;
function queueWrite(job){ outbox.push(job); flushOutbox(); }
async function flushOutbox(){
  if (flushing) return;
  flushing = true;
  while (outbox.length){
    const j = outbox[0];
    try {
      if (j.op === 'set') await api('/api/records/'+j.kind, {method:'POST', body: JSON.stringify(j.obj)});
      else if (j.op === 'del') await api('/api/records/'+j.kind+'/'+encodeURIComponent(j.id), {method:'DELETE'});
      else await api('/api/settings', {method:'PUT', body: JSON.stringify(S.settings)});
      outbox.shift();
      if (j.kind === 'appts') refreshSoon();
      if (!online){ online = true; toast('Back online — changes saved'); }
    } catch(e){
      if (String(e.message) === 'signed out'){ flushing = false; return; }
      if (online){ online = false; toast('Offline — changes will save when you reconnect'); }
      flushing = false;
      setTimeout(flushOutbox, 5000);
      return;
    }
  }
  flushing = false;
}
let refreshTimer = null;
function refreshSoon(){
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => {
    if (outbox.length) return;            /* never overwrite an unsaved edit */
    loadState().then(draw).catch(() => {});
  }, 1500);
}
function persist(kind, obj){ lsSave(kind); queueWrite({op:'set', kind, obj: JSON.parse(JSON.stringify(obj))}); }
function unpersist(kind, id){ lsSave(kind); queueWrite({op:'del', kind, id}); }

async function loadState(){
  const d = await api('/api/state');
  const defs = defaultSettings();
  const deviceTheme = S.settings.theme || 'auto';
  S.settings = Object.assign({}, defs, d.settings);
  S.settings.theme = deviceTheme;
  S.settings.tpl    = Object.assign({}, defs.tpl, d.settings.tpl || {});
  S.settings.notify = Object.assign({}, defs.notify, d.settings.notify || {});
  S.settings.biz    = Object.assign({}, defs.biz, d.settings.biz || {});
  if (!S.settings.hours || !Object.keys(S.settings.hours).length) S.settings.hours = defs.hours;
  for (let i = 0; i < 7; i++)
    if (!S.settings.hours[i]) S.settings.hours[i] = defs.hours[i];
  COLS.forEach(k => { S[k] = d[k] || []; lsSave(k); });
  S.photos = d.photos || [];
  S.coupons = d.coupons || [];
  S.settings.coupon = Object.assign({}, defs.coupon, d.settings.coupon || {});
  INTEGRATIONS = d.integrations || INTEGRATIONS;
  LASTRUN = d.lastRun || null;
  lsSave('settings');
}

/* ---------- record helpers ---------- */
function upsert(kind, obj){
  if (!obj.id) obj.id = uid();
  const arr = S[kind], i = arr.findIndex(x => x.id === obj.id);
  if (i >= 0) arr[i] = obj; else arr.push(obj);
  persist(kind, obj);
  return obj;
}
function remove(kind, id){
  S[kind] = S[kind].filter(x => x.id !== id);
  unpersist(kind, id);
}
function saveSettings(){ lsSave('settings'); queueWrite({op:'settings'}); }

/* per-client automation, falling back to the salon defaults */
function custAuto(c){
  const d = S.settings.autoDefaults || {};
  const a = (c && c.auto) || {};
  return {
    nightBefore: a.nightBefore !== undefined ? !!a.nightBefore : d.nightBefore !== false,
    rebookOn:    a.rebookOn    !== undefined ? !!a.rebookOn    : d.rebookOn !== false,
    rebookDays:  Number(a.rebookDays || d.rebookDays || 60),
    birthday:    a.birthday !== false
  };
}

/* ---------- birthdays ----------
   Stored as "1990-03-14", or "--03-14" when the client didn't give a year
   (plenty don't, and it's not needed to say happy birthday). */
function bdayParts(dob){
  const m = String(dob || '').match(/^(\d{4}|-)-(\d{2})-(\d{2})$/);
  if (!m) return null;
  return { y: m[1] === '-' ? '' : m[1], m: Number(m[2]), d: Number(m[3]) };
}
function bdayLabel(dob){
  const b = bdayParts(dob);
  return b ? MON[b.m-1] + ' ' + b.d : '';
}
/* the next date their birthday falls on, today included; Feb 29 -> Feb 28 off leap years */
function nextBirthday(dob){
  const b = bdayParts(dob); if (!b) return null;
  const t = todayISO(), y0 = Number(t.slice(0,4));
  for (const y of [y0, y0+1]){
    const leap = (y%4===0 && y%100!==0) || y%400===0;
    const d = (b.m === 2 && b.d === 29 && !leap) ? 28 : b.d;
    const s = y + '-' + pad2(b.m) + '-' + pad2(d);
    if (s >= t) return s;
  }
  return null;
}
function birthdaysSoon(days){
  const end = addDays(todayISO(), days);
  return S.customers.map(c => ({c, on: nextBirthday(c.dob)}))
    .filter(x => x.on && x.on <= end)
    .sort((a,b) => a.on.localeCompare(b.on));
}

/* ---------- coupons ---------- */
function couponOff(cp){
  const v = Number(cp.value), n = Number.isInteger(v) ? v : v.toFixed(2);
  return cp.type === 'amount' ? money(v) + ' off' : n + '% off';
}
function liveCoupons(customerId, apptId){
  const t = todayISO();
  return (S.coupons || []).filter(cp => cp.customerId === customerId &&
    ((!cp.redeemedAt && cp.expiresOn >= t) || (apptId && cp.apptId === apptId)));
}

const byId = (kind, id) => S[kind].find(x => x.id === id);
const cust = id => byId('customers', id);
const svc  = id => byId('services', id);

/* ---------- derived appointment data ---------- */
function apptServices(a){ return (a.serviceIds||[]).map(svc).filter(Boolean); }
function apptDuration(a){
  if (a.duration) return a.duration;
  const d = apptServices(a).reduce((t,s) => t + (Number(s.duration)||0), 0);
  return d || 60;
}
function apptServiceTotal(a){
  if (a.priceOverride != null && a.priceOverride !== '') return Number(a.priceOverride)||0;
  return apptServices(a).reduce((t,s) => t + (Number(s.price)||0), 0);
}
function apptProductTotal(a){ return (a.products||[]).reduce((t,p) => t + (Number(p.price)||0) * (Number(p.qty)||0), 0); }
function apptTotal(a){
  const p = a.payment || {};
  return Math.max(0, apptServiceTotal(a) + apptProductTotal(a) - (Number(p.discount)||0) + (Number(p.tip)||0));
}
/* what's still owed once any deposit taken at booking is counted */
function apptDue(a){ return Math.max(0, apptTotal(a) - (Number((a.payment||{}).deposit)||0)); }
function apptEnd(a){ return a.start + apptDuration(a); }
function serviceNames(a){ const n = apptServices(a).map(s => s.name); return n.length ? n.join(', ') : (a.title || 'Appointment'); }
const ACTIVE = a => a.status !== 'cancelled';
const COUNTED = a => a.status === 'completed';

function apptsOn(dateISO){
  return S.appts.filter(a => a.date === dateISO).sort((a,b) => a.start - b.start);
}
function upcomingAppts(limit){
  const t = todayISO(), n = nowMins();
  return S.appts
    .filter(a => ACTIVE(a) && a.status !== 'completed' && (a.date > t || (a.date === t && apptEnd(a) >= n)))
    .sort((a,b) => a.date.localeCompare(b.date) || a.start - b.start)
    .slice(0, limit || 999);
}
function custAppts(cid){
  return S.appts.filter(a => a.customerId === cid).sort((a,b) => b.date.localeCompare(a.date) || b.start - a.start);
}
function lastVisit(cid){
  const t = todayISO();
  const past = S.appts.filter(a => a.customerId === cid && a.status === 'completed' && a.date <= t)
    .sort((a,b) => b.date.localeCompare(a.date));
  return past[0] || null;
}
function nextVisit(cid){
  const t = todayISO();
  const fut = S.appts.filter(a => a.customerId === cid && ACTIVE(a) && a.status !== 'completed' && a.date >= t)
    .sort((a,b) => a.date.localeCompare(b.date) || a.start - b.start);
  return fut[0] || null;
}
function custSpend(cid){
  return S.appts.filter(a => a.customerId === cid && COUNTED(a)).reduce((t,a) => t + apptTotal(a), 0);
}
function revenueBetween(fromISO_, toISO_){
  return S.appts.filter(a => COUNTED(a) && a.date >= fromISO_ && a.date <= toISO_).reduce((t,a) => t + apptTotal(a), 0);
}
function weekStart(dateISO){ return addDays(dateISO, -dowOf(dateISO)); }

/* business hours */
function dayHours(dateISO){
  const h = (S.settings.hours && S.settings.hours[dowOf(dateISO)]) || {};
  const closed = (S.settings.closures||[]).some(c => dateISO >= c.from && dateISO <= (c.to || c.from));
  return { open: !!h.open && !closed, start: h.start ?? 540, end: h.end ?? 1080, breakOn: !!h.breakOn, breakStart: h.breakStart ?? 780, breakEnd: h.breakEnd ?? 840, closedReason: closed ? 'Closed' : '' };
}
function conflictsFor(a){
  return S.appts.filter(x => x.id !== a.id && x.date === a.date && ACTIVE(x) && x.status !== 'completed'
    && a.start < apptEnd(x) && apptEnd(a) > x.start);
}
function freeSlots(dateISO, minutes){
  const h = dayHours(dateISO);
  if (!h.open) return [];
  const step = Number(S.settings.slot) || 15;
  const taken = apptsOn(dateISO).filter(ACTIVE).map(a => [a.start, apptEnd(a)]);
  if (h.breakOn) taken.push([h.breakStart, h.breakEnd]);
  const out = [];
  const isToday = dateISO === todayISO(), n = nowMins();
  for (let t = h.start; t + minutes <= h.end; t += step){
    if (isToday && t < n) continue;
    if (taken.some(([s,e]) => t < e && t + minutes > s)) continue;
    out.push(t);
  }
  return out;
}

/* ---------- message templating ---------- */
function tplVars(c, a, extra){
  const st = S.settings, b = st.biz;
  const v = {
    first: c ? (c.first || fullName(c)) : 'there',
    name: c ? fullName(c) : 'there',
    stylist: b.stylist || b.name || 'your stylist',
    business: b.name || '',
    phone: b.phone || '',
    address: b.address || '',
    website: b.website || '',
    date: a ? fmtDate(a.date) : '',
    dateLong: a ? fmtDate(a.date,'long') : '',
    dateFull: a ? fmtDate(a.date,'full') : '',
    time: a ? fmtTime(a.start) : '',
    services: a ? serviceNames(a) : '',
    duration: a ? (apptDuration(a) + ' min') : '',
    price: a ? money(apptServiceTotal(a)) : '',
    since: c && lastVisit(c.id) ? sinceText(lastVisit(c.id).date) : 'a while',
    coupon: '', code: '', expires: '', couponLine: '', couponShort: '',
    when: ''
  };
  const cp = c && liveCoupons(c.id)[0];
  if (cp){
    v.coupon = couponOff(cp); v.code = cp.code; v.expires = fmtDate(cp.expiresOn, 'long');
    v.couponLine = "As a little birthday gift, here's " + v.coupon + " your next visit \u2014 just mention code " + cp.code +
      " when you book. It's good until " + v.expires + "." + (cp.note ? ' ' + cp.note : '');
    v.couponShort = "Here's " + v.coupon + " your next visit - code " + cp.code + ", good until " + fmtDate(cp.expiresOn) + ".";
  }
  return Object.assign(v, extra||{});
}
/* optional pieces like {couponLine} can come out empty — close the gaps,
   exactly as the server does before it sends */
function tidyMsg(s){
  return String(s || '')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .replace(/ {2,}/g, ' ')
    .replace(/ ([.,!])/g, '$1')
    .trim();
}
function render(tpl, vars){
  return String(tpl||'').replace(/\{(\w+)\}/g, (m,k) => (vars[k] != null ? vars[k] : m));
}
function logMessage(rec){
  rec.id = uid(); rec.sentAt = Date.now();
  upsert('msgs', rec);
}
function messageSent(apptId, kind){
  return S.msgs.some(m => m.apptId === apptId && m.kind === kind);
}
function lastMessageAt(customerId, kind){
  return S.msgs.filter(m => m.customerId === customerId && m.kind === kind)
    .reduce((t,m) => Math.max(t, m.sentAt || 0), 0);
}

/* ---------- UI atoms ---------- */
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2400);
}
function statusChip(s){
  const cls = s === 'noshow' ? 'st-noshow' : 'st-' + s;
  return '<span class="chip '+cls+'"><span class="dot"></span>'+statusLabel(s)+'</span>';
}
/* a steady colour per client, so Sarah is always the same pink */
const AV_HUES = [330, 12, 32, 150, 172, 200, 222, 262, 288, 350];
function avHue(c){
  const k = ((c && (c.first || '')) + '|' + (c && (c.last || ''))).toLowerCase();
  let h = 0; for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
  return AV_HUES[h % AV_HUES.length];
}
function avatar(c, size){
  const cls = 'av' + (size ? ' ' + size : '');
  if (c && c.photo) return '<span class="'+cls+'"><img src="'+esc(c.photo)+'" alt=""></span>';
  return '<span class="'+cls+'" style="--avh:'+avHue(c)+'">'+esc(initials(c||{}))+'</span>';
}

/* ---------- colour schemes ----------

function applyPalette(name){
  const p = PALETTES[name] || PALETTES.fuchsia;
  const decl = o => Object.entries(o).map(([k,v]) => '--'+k+':'+v).join(';');
  const grad = '--g1:'+p.g[0]+';--g2:'+p.g[1];
  const css =
    ':root{'+decl(p.light)+';'+grad+'}'+
    '@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){'+decl(p.dark)+';'+grad+'}}'+
    ':root[data-theme="dark"]{'+decl(p.dark)+';'+grad+'}';
  let tag = document.getElementById('palette');
  if (!tag){ tag = document.createElement('style'); tag.id = 'palette'; document.head.appendChild(tag); }
  tag.textContent = css;
  let meta = document.querySelector('meta[name="theme-color"]');
  if (!meta){ meta = document.createElement('meta'); meta.name = 'theme-color'; document.head.appendChild(meta); }
  meta.content = p.light.chalk;
}
applyPalette((function(){ try { return JSON.parse(localStorage.getItem('chaircomb.v1.settings')||'{}').palette; } catch(e){ return ''; } })());

<script>
"use strict";
/* ============================================================
   Sheets, routing, navigation
   ============================================================ */
const sheetStack = [];

function openSheet(cfg){ sheetStack.push(cfg); paintSheet(); }
function replaceSheet(cfg){ sheetStack.pop(); sheetStack.push(cfg); paintSheet(); }
function closeSheet(){ sheetStack.pop(); if (sheetStack.length) paintSheet(); else hideSheet(); }
function closeAllSheets(){ sheetStack.length = 0; hideSheet(); }
function hideSheet(){
  $('#sheet').classList.remove('on'); $('#scrim').classList.remove('on');
  setTimeout(() => { if (!sheetStack.length) $('#sheetbody').innerHTML = ''; }, 220);
}
function paintSheet(){
  const cfg = sheetStack[sheetStack.length-1];
  $('#sheettitle').textContent = cfg.title || '';
  $('#sheetbody').innerHTML = cfg.body || '';
  $('#sheetfoot').innerHTML = cfg.foot || '';
  $('#sheetfoot').style.display = cfg.foot ? '' : 'none';
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
  $('#sheetbody').scrollTop = 0;
  if (cfg.onMount) cfg.onMount($('#sheet'));
}
$('#scrim').addEventListener('click', closeAllSheets);
$('#sheetclose').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetStack.length) closeSheet(); });

function confirmSheet(title, msg, okLabel, onOk, danger){
  openSheet({
    title,
    body: '<p class="small dim">'+esc(msg)+'</p>',
    foot: '<button class="btn ghost" data-act="cancel">Keep it</button><button class="btn '+(danger?'danger':'primary')+'" data-act="ok">'+esc(okLabel)+'</button>',
    onMount(root){
      $('[data-act="cancel"]', root).onclick = closeSheet;
      $('[data-act="ok"]', root).onclick = () => { closeSheet(); onOk(); };
    }
  });
}

/* ---------- routing ---------- */
const NAV = [
  {id:'dashboard', label:'Today',    icon:'home'},
  {id:'calendar',  label:'Calendar', icon:'cal'},
  {id:'customers', label:'Clients',  icon:'users'},
  {id:'services',  label:'Services', icon:'scissors'},
  {id:'products',  label:'Products', icon:'box'},
  {id:'payments',  label:'Payments', icon:'cash'},
  {id:'reports',   label:'Reports',  icon:'chart'},
  {id:'settings',  label:'Settings', icon:'gear'},
];
const TABS = ['dashboard','calendar','customers','payments','more'];

let route = 'dashboard', routeParam = null;
let calMode = 'day', calDate = todayISO();
let custQuery = '', custSort = 'name';

function go(r, param){
  route = r; routeParam = param || null;
  closeAllSheets();
  draw();
  window.scrollTo(0,0);
}

function drawNav(){
  $('#sidenav').innerHTML = NAV.map(n =>
    '<button data-go="'+n.id+'"'+(route===n.id?' aria-current="page"':'')+'>'+svg(n.icon)+'<span>'+n.label+'</span></button>'
  ).join('');
  $('#tabbar').innerHTML = TABS.map(t => {
    if (t === 'more') return '<button data-more="1"'+(['services','products','reports','settings'].includes(route)?' aria-current="page"':'')+'>'+
      '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>';
    const n = NAV.find(x => x.id === t);
    return '<button data-go="'+n.id+'"'+(route===n.id?' aria-current="page"':'')+'>'+svg(n.icon)+'<span>'+n.label+'</span></button>';
  }).join('');
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g){ go(g.dataset.go); return; }
  if (e.target.closest('[data-more]')) openMore();
});

function openMore(){
  openSheet({
    title:'More',
    body:'<div class="list">' + ['services','products','reports','settings'].map(id => {
      const n = NAV.find(x => x.id === id);
      return '<button class="item" data-go="'+id+'">'+svg(n.icon,'')+
        '<span class="grow nm">'+n.label+'</span>'+svg('chev')+'</button>';
    }).join('') + '</div>',
    onMount(root){
      $$('.item svg', root).forEach(s => { s.style.width='20px'; s.style.height='20px'; s.style.stroke='var(--plum)'; s.style.fill='none'; s.style.strokeWidth='1.8'; });
      $$('[data-go]', root).forEach(b => b.addEventListener('click', closeAllSheets));
    }
  });
}

/* ---------- main draw ---------- */
function draw(){
  drawNav();
  const v = $('#view');
  const titles = {dashboard:'Today', calendar:'Calendar', customers:'Clients', services:'Services',
    products:'Products', payments:'Payments', reports:'Reports', settings:'Settings', customer:'Client'};
  $('#pagetitle').textContent = titles[route] || '';
  if (route === 'dashboard') v.innerHTML = viewDashboard();
  else if (route === 'calendar') v.innerHTML = viewCalendar();
  else if (route === 'customers') v.innerHTML = viewCustomers();
  else if (route === 'customer') v.innerHTML = viewCustomer(routeParam);
  else if (route === 'services') v.innerHTML = viewServices();
  else if (route === 'products') v.innerHTML = viewProducts();
  else if (route === 'payments') v.innerHTML = viewPayments();
  else if (route === 'reports') v.innerHTML = viewReports();
  else if (route === 'settings') v.innerHTML = viewSettings();
  wireView();
}

function nightTs(a){
  const d = fromISO(a.date);
  d.setDate(d.getDate()-1);
  d.setHours(Number(S.settings.nightHour ?? 19), 0, 0, 0);
  return d.getTime();
}
function dueReminders(){
  const out = [], now = Date.now(), n = S.settings.notify;

  /* per-appointment: confirmation, the night-before email, the short-notice text */
  upcomingAppts().forEach(a => {
    const c = cust(a.customerId);
    if (!c || (!c.phone && !c.email)) return;
    const auto = custAuto(c);
    const ts = whenTS(a.date, a.start);
    if (n.confirm && !messageSent(a.id, 'confirm'))
      out.push({a, c, kind:'confirm', channel: c.email ? 'email' : 'sms', label:'Confirmation not sent', at: ts});
    if (n.night && auto.nightBefore && c.email && !messageSent(a.id, 'night') && now >= nightTs(a))
      out.push({a, c, kind:'night', channel:'email', label:'Night-before email due', at: nightTs(a)});
    if (n.r2 && c.phone && !messageSent(a.id, 'r2') && now >= ts - (n.r2h||2)*3600000)
      out.push({a, c, kind:'r2', channel:'sms', label:(n.r2h||2)+'-hour text due', at: ts});
  });

  /* per-client: the rebooking email, every N days until they book again */
  if (n.rebook) S.customers.forEach(c => {
    if (!c.email) return;
    const auto = custAuto(c);
    if (!auto.rebookOn) return;
    if (nextVisit(c.id)) return;
    const lv = lastVisit(c.id);
    if (!lv) return;
    const base = Math.max(whenTS(lv.date, 12*60), lastMessageAt(c.id, 'rebook'));
    const due = base + auto.rebookDays*86400000;
    if (now >= due)
      out.push({a:null, c, kind:'rebook', channel:'email',
        label:'Rebooking email due · '+auto.rebookDays+'-day check-in', at: due});
  });

  return out.sort((x,y) => x.at - y.at);
}
function followUpList(){
  const weeks = Number(S.settings.followupWeeks) || 6;
  const cutoff = addDays(todayISO(), -weeks*7);
  return S.customers.filter(c => {
    if (nextVisit(c.id)) return false;
    if (c.email && custAuto(c).rebookOn && S.settings.notify.rebook) return false; /* already queued */
    const lv = lastVisit(c.id);
    return lv && lv.date <= cutoff;
  }).sort((a,b) => (lastVisit(a.id).date).localeCompare(lastVisit(b.id).date));
}
function lowStock(){ return S.products.filter(p => Number(p.qty) <= Number(p.minQty || 0)); }

          '<div style="text-align:right"><div class="num" style="font-size:.95rem">'+money(apptServiceTotal(a))+'</div>'+

function timeAgo(ts){
  if (!ts) return 'just now';
  const m = Math.round((Date.now() - ts)/60000);
  if (m < 1) return 'just now';
  if (m < 60) return m+' min ago';
  const h = Math.round(m/60);
  if (h < 24) return h+' hour'+(h===1?'':'s')+' ago';
  const d = Math.round(h/24);
  return d+' day'+(d===1?'':'s')+' ago';
}
function automationLine(){
  if (!INTEGRATIONS.email && !INTEGRATIONS.sms && !INTEGRATIONS.dryRun)
    return 'Nothing can be sent yet — add your Resend and Twilio keys to the server.';
  const bits = [];
  if (INTEGRATIONS.email) bits.push('Email on');
  if (INTEGRATIONS.sms) bits.push('Texts on');
  if (INTEGRATIONS.dryRun) bits.push('Test mode — nothing actually leaves');
  if (LASTRUN) bits.push('last checked '+timeAgo(LASTRUN.at));
  return bits.join(' · ');
}
/* `action` makes the tile a button: data-stat="<action>" is picked up by the
   click handler at the bottom of the page */
function stat(k, v, money_, color, action){
  const tag = action ? 'button' : 'div';
  return '<'+tag+' class="stat'+(action?' tap':'')+'"'+(action ? ' data-stat="'+action+'" aria-label="'+esc(k)+': '+esc(String(v))+'"' : '')+
    (color ? ' style="--sc:'+color+'"' : '')+'><div class="k">'+esc(k)+(action ? svg('chev','stat-chev') : '')+'</div>'+
    '<div class="v num'+(money_?' money':'')+'">'+v+'</div></'+tag+'>';
}

/* every future appointment, grouped by day, opened from the Upcoming tile */
function upcomingSheet(){
  const list = upcomingAppts();
  let body;
  if (!list.length){
    body = '<div class="card empty"><h3>Nothing booked ahead</h3>'+
      '<p class="small">Book someone in and they\'ll show up here.</p>'+
      '<button class="btn primary" data-new="appt">'+svg('plus')+'New appointment</button></div>';
  } else {
    const days = [];
    list.forEach(a => {
      let g = days[days.length-1];
      if (!g || g.date !== a.date){ g = {date:a.date, appts:[]}; days.push(g); }
      g.appts.push(a);
    });
    body = days.map(g => {
      const rel = fmtDate(g.date,'rel'), long = fmtDate(g.date,'long');
      const soon = rel === 'Today' || rel === 'Tomorrow';
      return '<div class="sec-head" style="margin-top:14px"><h3>'+esc(soon ? rel : long)+'</h3>'+
        (soon ? '<span class="small dim">'+esc(long)+'</span>' : '')+
        '<span class="grow"></span><button class="btn sm ghost" data-goday="'+g.date+'">Calendar</button></div>'+
        '<div class="card list">'+g.appts.map(apptRow).join('')+'</div>';
    }).join('');
  }
  openSheet({
    title: 'Upcoming · '+list.length,
    body,
    foot:'<button class="btn ghost" data-act="close">Close</button><button class="btn primary" data-new="appt">'+svg('plus')+'New appointment</button>',
    onMount(root){ $('[data-act="close"]', root).onclick = closeSheet; },
    refresh(){ sheetStack.pop(); upcomingSheet(); }
  });
}

/* ============================================================
   Calendar
   ============================================================ */
const HOUR_PX = 56;

function viewCalendar(){
  let s = '<div style="padding:14px 0 0">';
  s += '<div class="seg" style="margin-bottom:14px">'+['day','week','month'].map(m =>
      '<button data-calmode="'+m+'" aria-pressed="'+(calMode===m)+'">'+m[0].toUpperCase()+m.slice(1)+'</button>').join('')+'</div>';

  s += '<div class="cal-head">'+
    '<button class="iconbtn" data-calnav="-1" aria-label="Previous">'+svg('left')+'</button>'+
    '<span class="t">'+calTitle()+'</span>'+
    '<button class="btn sm ghost" data-calnav="0">Today</button>'+
    '<button class="iconbtn" data-calnav="1" aria-label="Next">'+svg('right')+'</button>'+
    '<button class="iconbtn" data-new="appt" aria-label="New appointment" style="background:var(--plum);color:#fff">'+svg('plus')+'</button>'+
  '</div>';

  if (calMode === 'month') s += monthGrid();
  else s += timeGrid(calMode === 'day' ? [calDate] : weekDates());
  s += '<p class="tiny dim center" style="margin-top:10px">'+(calMode==='month'
      ? 'Tap a day to see it below. Tap it again to open the day.' : 'Tap an appointment to open it. Drag it to a new time.')+'</p>';
  s += '</div>';
  return s;
}
function weekDates(){ const ws = weekStart(calDate); return Array.from({length:7}, (_,i) => addDays(ws,i)); }
function calTitle(){
  if (calMode === 'day') return fmtDate(calDate,'long');
  if (calMode === 'month'){ const d = fromISO(calDate); return MON[d.getMonth()]+' '+d.getFullYear(); }
  const w = weekDates(), a = fromISO(w[0]), b = fromISO(w[6]);
  return MON[a.getMonth()].slice(0,3)+' '+a.getDate()+' – '+(a.getMonth()!==b.getMonth() ? MON[b.getMonth()].slice(0,3)+' ' : '')+b.getDate();
}

function monthGrid(){
  const d = fromISO(calDate), y = d.getFullYear(), m = d.getMonth();
  const first = new Date(y, m, 1), startPad = first.getDay();
  const days = new Date(y, m+1, 0).getDate();
  const t = todayISO();
  let cells = [];
  for (let i = 0; i < startPad; i++){ const dd = new Date(y, m, -(startPad-1-i)); cells.push({iso:iso(dd), off:true}); }
  for (let i = 1; i <= days; i++) cells.push({iso:iso(new Date(y,m,i)), off:false});
  while (cells.length % 7) { const last = fromISO(cells[cells.length-1].iso); last.setDate(last.getDate()+1); cells.push({iso:iso(last), off:true}); }

  let s = '<div class="month">'+['S','M','T','W','T','F','S'].map(x => '<div class="dow">'+x+'</div>').join('');
  const MAX_EV = 3;
  cells.forEach(c => {
    const list = apptsOn(c.iso).filter(ACTIVE);
    const cls = ['day']; if (c.off) cls.push('off'); if (c.iso === t) cls.push('today'); if (c.iso === calDate) cls.push('sel'); if (list.length) cls.push('has');
    const label = fmtDate(c.iso,'full')+(list.length ? ', '+list.length+' appointment'+(list.length>1?'s':'') : '');
    s += '<button class="'+cls.join(' ')+'" data-calday="'+c.iso+'" aria-label="'+esc(label)+'" aria-pressed="'+(c.iso===calDate)+'">'+
      '<span class="dn">'+fromISO(c.iso).getDate()+'</span>'+
      '<span class="dots">'+list.slice(0,4).map(() => '<i></i>').join('')+'</span>'+
      '<span class="evs">'+list.slice(0, MAX_EV).map(a => {
        const cu = cust(a.customerId);
        const who = cu ? (cu.first || fullName(cu)) : 'Client';
        return '<span class="mev s-'+a.status+'" title="'+esc(fmtTime(a.start)+' '+fullName(cu)+' · '+serviceNames(a))+'">'+
          fmtTime(a.start)+' '+esc(who)+'</span>';
      }).join('')+
      (list.length > MAX_EV ? '<span class="mev more">+'+(list.length-MAX_EV)+' more</span>' : '')+
      '</span></button>';
  });
  s += '</div>';
  const list = apptsOn(calDate);
  s += '<div class="sec" id="daylist"><div class="sec-head"><h2>'+fmtDate(calDate,'long')+'</h2>'+
    (list.length ? '<span class="small dim">'+list.length+' booked</span>' : '')+
    '<span class="grow"></span><button class="btn sm ghost" data-openday="'+calDate+'">Open day</button></div>';
  s += list.length ? '<div class="card list">'+list.map(apptRow).join('')+'</div>'
    : '<div class="card empty"><p class="small">Nothing booked.</p><button class="btn primary" data-new="appt" data-date="'+calDate+'">'+svg('plus')+'Book this day</button></div>';
  s += '</div>';
  return s;
}
function apptRow(a){
  const c = cust(a.customerId);
  return '<button class="item" data-appt="'+a.id+'">'+
    '<span style="width:58px;flex:none" class="small num">'+fmtTime(a.start)+'</span>'+
    '<span class="grow"><span class="nm">'+esc(fullName(c))+'</span>'+
    '<span class="tiny dim trunc" style="display:block">'+esc(serviceNames(a))+'</span></span>'+
    statusChip(a.status)+'</button>';
}

function timeGrid(dates){
  let lo = 24*60, hi = 0;
  dates.forEach(d => {
    const h = dayHours(d);
    if (h.open){ lo = Math.min(lo, h.start); hi = Math.max(hi, h.end); }
    apptsOn(d).forEach(a => { lo = Math.min(lo, a.start); hi = Math.max(hi, apptEnd(a)); });
  });
  if (hi <= lo){ lo = 9*60; hi = 18*60; }
  lo = Math.floor(lo/60)*60; hi = Math.ceil(hi/60)*60;
  const hours = (hi - lo)/60;
  const cols = 'minmax(46px,46px) repeat('+dates.length+',minmax(0,1fr))';
  const t = todayISO();

  let s = '<div class="grid-cal" data-lo="'+lo+'" data-hi="'+hi+'">';
  s += '<div class="gc-head" style="grid-template-columns:'+cols+'"><div></div>'+
    dates.map(d => '<div class="'+(d===t?'is-today':'')+'">'+(dates.length>1
      ? DOW[dowOf(d)].slice(0,3)+'<br>'+fromISO(d).getDate()
      : fmtDate(d,'long'))+'</div>').join('')+'</div>';
  s += '<div class="gc-body"><div class="gc-cols" style="grid-template-columns:'+cols+'">';
  s += '<div class="gc-gut">'+Array.from({length:hours},(_,i) =>
      '<div class="gc-hour">'+fmtTime(lo+i*60)+'</div>').join('')+'</div>';

  dates.forEach(d => {
    const h = dayHours(d);
    s += '<div class="gc-col" data-date="'+d+'">';
    s += Array.from({length:hours},() => '<div class="gc-hour"></div>').join('');
    const px = m => ((m - lo)/60)*HOUR_PX;
    if (!h.open) s += '<div class="closed" style="top:0;height:'+(hours*HOUR_PX)+'px"></div>';
    else {
      if (h.start > lo) s += '<div class="closed" style="top:0;height:'+px(h.start)+'px"></div>';
      if (h.end < hi) s += '<div class="closed" style="top:'+px(h.end)+'px;height:'+(hours*HOUR_PX - px(h.end))+'px"></div>';
      if (h.breakOn) s += '<div class="closed" style="top:'+px(h.breakStart)+'px;height:'+((h.breakEnd-h.breakStart)/60*HOUR_PX)+'px"></div>';
    }
    if (d === t && nowMins() >= lo && nowMins() <= hi)
      s += '<div class="nowline" style="top:'+px(nowMins())+'px"></div>';
    apptsOn(d).forEach(a => {
      const c = cust(a.customerId);
      const top = px(a.start), hgt = Math.max(20, apptDuration(a)/60*HOUR_PX - 2);
      s += '<button class="ev s-'+a.status+'" data-appt="'+a.id+'" data-drag="'+a.id+'" style="top:'+top+'px;height:'+hgt+'px">'+
        '<b>'+esc(fullName(c))+'</b>'+(hgt > 34 ? '<span>'+fmtTime(a.start)+' · '+esc(serviceNames(a))+'</span>' : '')+'</button>';
    });
    s += '</div>';
  });
  s += '</div></div></div>';
  return s;
}

/* drag to reschedule */
function wireDrag(){
  const cols = $('.gc-cols'); if (!cols) return;
  const grid = $('.grid-cal'); const lo = Number(grid.dataset.lo);
  let drag = null;

  cols.addEventListener('pointerdown', e => {
    const ev = e.target.closest('[data-drag]'); if (!ev) return;
    const a = byId('appts', ev.dataset.drag); if (!a || a.status === 'cancelled') return;
    drag = {el:ev, a, y0:e.clientY, x0:e.clientX, top0:parseFloat(ev.style.top), moved:false,
            colW: $('.gc-col').getBoundingClientRect().width, date0:a.date};
    ev.setPointerCapture(e.pointerId);
  });
  cols.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = e.clientY - drag.y0, dx = e.clientX - drag.x0;
    if (!drag.moved && Math.abs(dy) < 6 && Math.abs(dx) < 6) return;
    drag.moved = true; drag.el.classList.add('drag');
    drag.el.style.top = (drag.top0 + dy) + 'px';
    drag.el.style.transform = 'translateX('+Math.round(dx/drag.colW)*drag.colW+'px)';
    e.preventDefault();
  });
  const finish = e => {
    if (!drag) return;
    const d = drag; drag = null;
    d.el.classList.remove('drag'); d.el.style.transform = '';
    if (!d.moved){ d.el.style.top = d.top0+'px'; return; }
    const step = Number(S.settings.slot) || 15;
    const dy = e.clientY - d.y0, dx = e.clientX - d.x0;
    const mins = clamp(Math.round((d.a.start + dy/HOUR_PX*60)/step)*step, 0, 1440 - apptDuration(d.a));
    const dates = calMode === 'day' ? [calDate] : weekDates();
    const idx = clamp(dates.indexOf(d.date0) + Math.round(dx/d.colW), 0, dates.length-1);
    const newDate = dates[idx];
    if (mins === d.a.start && newDate === d.date0){ draw(); return; }
    rescheduleAppt(d.a, newDate, mins);
  };
  cols.addEventListener('pointerup', finish);
  cols.addEventListener('pointercancel', () => { if (drag){ drag.el.classList.remove('drag'); drag.el.style.transform=''; drag.el.style.top = drag.top0+'px'; drag = null; } });
}

function rescheduleAppt(a, newDate, newStart){
  const old = {date:a.date, start:a.start};
  a.date = newDate; a.start = newStart;
  const clash = conflictsFor(a);
  const commit = () => {
    upsert('appts', a);
    draw();
    const c = cust(a.customerId);
    toast('Moved to '+fmtDate(newDate,'rel')+' '+fmtTime(newStart)+((c && (c.phone || c.email)) ? ' — client notified' : ''));
    /* the server tells the client it moved; nothing to do here */
  };
  if (clash.length){
    a.date = old.date; a.start = old.start;
    confirmSheet('That overlaps', fullName(cust(clash[0].customerId))+' is booked '+fmtTime(clash[0].start)+'–'+fmtTime(apptEnd(clash[0]))+'. Move it anyway?',
      'Move anyway', () => { a.date = newDate; a.start = newStart; commit(); });
    draw();
    return;
  }
  commit();
}

function matchCustomer(c, q){
  q = q.trim().toLowerCase(); if (!q) return true;
  const digits = q.replace(/\D/g,'');
  return fullName(c).toLowerCase().includes(q)
    || String(c.email||'').toLowerCase().includes(q)
    || (digits.length >= 3 && String(c.phone||'').replace(/\D/g,'').includes(digits));
}
/* Can we text this client? Needs a number, their recorded agreement, and no STOP. */
function canText(c){ return !!(c && c.phone && c.smsConsent && !c.smsOptOut); }
function textStatus(c){
  if (!c || !c.phone) return {ok:false, label:'No phone number'};
  if (c.smsOptOut) return {ok:false, label:'Replied STOP — no texts'};
  if (!c.smsConsent) return {ok:false, label:'Not agreed yet — ask before texting'};
  return {ok:true, label:'Agreed' + (c.smsConsentHow ? ' ' + c.smsConsentHow.toLowerCase().replace('texted start','by texting START') : '') +
    (c.smsConsentAt ? ' on ' + fmtDate(iso(new Date(c.smsConsentAt))) : '')};
}
const needsTextOk = c => !!c.phone && !c.smsConsent && !c.smsOptOut;

function sortedCustomers(){
  const list = S.customers.filter(c => matchCustomer(c, custQuery) && (custSort !== 'textok' || needsTextOk(c)));
  const key = {
    name: (a,b) => (a.last||a.first||'').localeCompare(b.last||b.first||''),
    recent: (a,b) => (lastVisit(b.id)?.date || '').localeCompare(lastVisit(a.id)?.date || ''),
    spend: (a,b) => custSpend(b.id) - custSpend(a.id),

  return list.sort(key);
}
