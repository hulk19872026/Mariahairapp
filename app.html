/* Resize in the browser before uploading: a 12MP phone photo turns into about
   300KB, which is the difference between instant and hopeless on salon wifi. */
function shrinkBlob(file, max, quality){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('Could not read that file'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('That file is not an image'));
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.max(1, Math.round(img.width * sc));
        cv.height = Math.max(1, Math.round(img.height * sc));
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(b => b ? res({blob:b, w:cv.width, h:cv.height}) : rej(new Error('Could not process that image')),
          'image/jpeg', quality);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const PHOTO_TAGS = ['Before','After','Formula','Inspiration'];

let uploading = 0;
function photoURL(id, size){ return '/api/photos/'+id+(size === 'thumb' ? '?size=thumb' : ''); }

/* the visit a photo taken right now belongs to: today's appointment for this
   client, if there is one */
function todaysAppt(customerId){
  const t = todayISO();
  const list = S.appts.filter(a => a.customerId === customerId && a.date === t && a.status !== 'cancelled')
    .sort((a,b) => Math.abs(a.start - nowMins()) - Math.abs(b.start - nowMins()));
  return list[0] || null;
}

async function uploadPhotos(customerId, files, apptId, tag){
  const list = Array.from(files).filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name||''));
  if (!list.length){ toast('Pick an image'); return; }
  let done = 0, failed = 0;
  uploading += list.length; draw();
  if (tag) toast('Saving '+tag.toLowerCase()+' photo…');
  for (const f of list){
    try {
      const big = await shrinkBlob(f, 1600, 0.82);
      const small = await shrinkBlob(f, 400, 0.72);
      const fd = new FormData();
      fd.append('customerId', customerId);
      if (apptId) fd.append('appointmentId', apptId);
      if (tag) fd.append('tag', tag);
      fd.append('width', big.w); fd.append('height', big.h);
      fd.append('full', big.blob, 'full.jpg');
      fd.append('thumb', small.blob, 'thumb.jpg');
      const res = await fetch('/api/photos', {method:'POST', body: fd, credentials:'same-origin'});
      if (res.status === 401){ window.location.href = '/login'; return; }
      if (!res.ok){ let m=''; try{ m=(await res.json()).error; }catch(e){} throw new Error(m || 'Upload failed'); }
      S.photos.unshift(await res.json());
      done++;
    } catch(e){ failed++; toast(e.message || 'Could not upload that photo'); }
    uploading = Math.max(0, uploading - 1);
    draw();
    if (sheetStack.length && sheetStack[sheetStack.length-1].refresh) sheetStack[sheetStack.length-1].refresh();
  }
  if (done) toast(tag && done === 1
    ? tag + ' photo saved to ' + (fullName(cust(customerId)).split(' ')[0] || 'their') + '\'s file'
    : done + ' photo' + (done>1?'s':'') + ' added' + (failed ? ', ' + failed + ' failed' : ''));
}

/* A hidden file input: with `camera` it goes straight to the rear camera on a
   phone; otherwise it opens the photo library (or a file picker on a computer). */
function pickImages(opts, onFiles){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  if (opts.camera) input.setAttribute('capture', 'environment');
  if (opts.multiple) input.multiple = true;
  input.style.display = 'none';
  document.body.appendChild(input);
  input.onchange = () => {
    const files = input.files;
    input.remove();
    if (files && files.length) onFiles(files);
  };
  input.click();
}

/* One before-and-after per visit: the latest Before and latest After taken
   for the same appointment — or, with no appointment, on the same day. */
function visitPairs(customerId){
  const groups = {};
  S.photos.filter(p => p.customerId === customerId && (p.tag === 'Before' || p.tag === 'After')).forEach(p => {
    const key = p.apptId || ('day:' + iso(new Date(p.createdAt)));
    const g = groups[key] || (groups[key] = {key, apptId: p.apptId, at: p.createdAt, before: null, after: null});
    const slot = p.tag === 'Before' ? 'before' : 'after';
    if (!g[slot] || (p.createdAt||0) > (g[slot].createdAt||0)) g[slot] = p;
    g.at = Math.max(g.at, p.createdAt || 0);
  });
  return Object.values(groups).sort((a,b) => b.at - a.at);
}

function compareSheet(beforeId, afterId){
  const b = S.photos.find(p => p.id === beforeId), a = S.photos.find(p => p.id === afterId);

      '<p class="small dim center" style="margin-top:10px">Drag across the photo to compare.</p>'+
      (visit ? '<p class="small center" style="margin-top:4px"><b>'+fmtDate(visit.date,'long')+'</b> · '+esc(serviceNames(visit))+'</p>' : '')+
      '<div class="row-tight" style="margin-top:14px;justify-content:center">'+
        '<button class="btn sm ghost" data-photo="'+b.id+'">Edit before</button>'+
        '<button class="btn sm ghost" data-photo="'+a.id+'">Edit after</button></div>',
    onMount(root){
      const box = $('#cmp', root), top = $('.cb', box), handle = $('.ch', box);
      const set = x => {
        const r = box.getBoundingClientRect();
        const pct = clamp(((x - r.left) / (r.width || 1)) * 100, 0, 100);
        top.style.clipPath = 'inset(0 ' + (100 - pct) + '% 0 0)';
        handle.style.left = pct + '%';
      };
      let dragging = false;
      box.addEventListener('pointerdown', e => { dragging = true; box.setPointerCapture(e.pointerId); set(e.clientX); });
      box.addEventListener('pointermove', e => { if (dragging) set(e.clientX); });
      box.addEventListener('pointerup', () => { dragging = false; });
      box.addEventListener('pointercancel', () => { dragging = false; });
      box.addEventListener('keydown', e => {
        const cur = parseFloat(handle.style.left || '50');
        const r = box.getBoundingClientRect();
        if (e.key === 'ArrowLeft') set(r.left + r.width * (cur - 5) / 100);
        if (e.key === 'ArrowRight') set(r.left + r.width * (cur + 5) / 100);
      });
      box.tabIndex = 0;
      box.setAttribute('role', 'slider');
      box.setAttribute('aria-label', 'Before and after comparison');
    }
  });
}

        } catch(e){ if (String(e.message) !== 'signed out') toast(e.message); }
      };
    }

function shrinkImage(file, max){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', .78));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  const ws = weekStart(t);

  s += '<div class="stats" style="grid-template-columns:repeat(2,1fr)">'+
    stat('Today', money(revenueBetween(t,t)), true)+

    stat('Unpaid', money(unpaid.reduce((x,a) => x + apptTotal(a), 0)))+
    stat('Avg ticket', money(done.length ? done.reduce((x,a) => x+apptTotal(a),0)/done.length : 0), true)+'</div>';

let repRange = 'month';
function viewReports(){
  const t = todayISO();
  const ranges = {week:[weekStart(t), addDays(weekStart(t),6)], month:[t.slice(0,8)+'01', iso(new Date(fromISO(t).getFullYear(), fromISO(t).getMonth()+1, 0))],
    year:[t.slice(0,4)+'-01-01', t.slice(0,4)+'-12-31'], all:['0000-01-01','9999-12-31']};
  const [from, to] = ranges[repRange];
  const done = S.appts.filter(a => COUNTED(a) && a.date >= from && a.date <= to);
  const rev = done.reduce((x,a) => x + apptTotal(a), 0);
  const tips = done.reduce((x,a) => x + (Number((a.payment||{}).tip)||0), 0);
  const prod = done.reduce((x,a) => x + apptProductTotal(a), 0);
  const noShows = S.appts.filter(a => a.status==='noshow' && a.date>=from && a.date<=to).length;

  let s = '<div style="padding:14px 0 0">';
  s += '<div class="seg" style="margin-bottom:16px">'+[['week','This week'],['month','This month'],['year','This year'],['all','All time']]
    .map(([k,l]) => '<button data-rep="'+k+'" aria-pressed="'+(repRange===k)+'">'+l+'</button>').join('')+'</div>';

  s += '<div class="stats">'+
    stat('Revenue', money(rev), true)+
    stat('Appointments', done.length)+
    stat('Average ticket', money(done.length ? rev/done.length : 0), true)+
    stat('Tips', money(tips), true)+'</div>';

  /* trend */
  const buckets = trendBuckets(repRange);
  const max = Math.max(1, ...buckets.map(b => b.v));
  s += '<div class="sec"><div class="sec-head"><h2>Trend</h2></div><div class="card pad">'+
    '<div class="spark">'+buckets.map(b =>
      '<span class="col"><i style="height:'+Math.max(2, Math.round(b.v/max*70))+'px" title="'+money(b.v)+'"></i><span>'+esc(b.l)+'</span></span>').join('')+
    '</div><p class="tiny dim center" style="margin-top:8px">Peak '+money(max)+'</p></div></div>';

  /* by service */
  const bySvc = {};
  done.forEach(a => {
    const list = apptServices(a);
    const tot = apptServiceTotal(a);
    const sum = list.reduce((x,s2) => x + (Number(s2.price)||0), 0) || 1;
    list.forEach(s2 => { bySvc[s2.name] = (bySvc[s2.name]||0) + tot * ((Number(s2.price)||0)/sum); });
  });
  s += barBlock('Revenue by service', bySvc);

  /* by client */
  const byCust = {};
  done.forEach(a => { const c = cust(a.customerId); if (c) byCust[fullName(c)] = (byCust[fullName(c)]||0) + apptTotal(a); });
  s += barBlock('Top clients', byCust, 6);

  /* extras */
  s += '<div class="sec"><div class="sec-head"><h2>Detail</h2></div><div class="card pad"><dl class="kv">'+
    '<dt>Service revenue</dt><dd>'+money(rev - tips - prod)+'</dd>'+
    '<dt>Product sales</dt><dd>'+money(prod)+'</dd>'+
    '<dt>Tips</dt><dd>'+money(tips)+'</dd>'+
    '<dt>Discounts given</dt><dd>'+money(done.reduce((x,a) => x + (Number((a.payment||{}).discount)||0), 0))+'</dd>'+
    '<dt>No-shows</dt><dd>'+noShows+'</dd>'+
    '<dt>New clients</dt><dd>'+S.customers.filter(c => c.createdAt && iso(new Date(c.createdAt)) >= from && iso(new Date(c.createdAt)) <= to).length+'</dd>'+
    '</dl></div></div>';

  s += '<div class="sec"><button class="btn ghost block" data-export="csv">'+svg('dl')+'Export this period as CSV</button></div>';
  s += '</div>';
  return s;
}
function trendBuckets(range){
  const t = todayISO(), out = [];
  if (range === 'week' || range === 'month'){
    const n = range === 'week' ? 7 : 14;
    for (let i = n-1; i >= 0; i--){
      const d = addDays(t, -i);
      out.push({l: DOW[dowOf(d)][0] + (n>7 ? '' : ''), v: revenueBetween(d,d)});
    }
  } else {
    for (let i = 11; i >= 0; i--){
      const d = fromISO(t); d.setMonth(d.getMonth()-i);
      const a = iso(new Date(d.getFullYear(), d.getMonth(), 1)), b = iso(new Date(d.getFullYear(), d.getMonth()+1, 0));
      out.push({l: MON[d.getMonth()][0], v: revenueBetween(a,b)});
    }
  }
  return out;
}
function barBlock(title, map, limit){
  const rows = Object.entries(map).sort((a,b) => b[1]-a[1]).slice(0, limit || 8);
  if (!rows.length) return '';
  const max = Math.max(...rows.map(r => r[1])) || 1;
  return '<div class="sec"><div class="sec-head"><h2>'+esc(title)+'</h2></div><div class="card pad"><div class="bars">'+
    rows.map(([k,v]) => '<div class="bar-row"><span class="lab trunc">'+esc(k)+'</span><span class="amt">'+money(v)+'</span>'+
      '<span class="bar-track"><span class="bar-fill" style="width:'+Math.round(v/max*100)+'%"></span></span></div>').join('')+
    '</div></div></div>';
}

/* ---------- export / import ---------- */
function download(filename, text, type){
  const blob = new Blob([text], {type: type || 'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 400);
}
function csvCell(v){ const s = String(v==null?'':v); return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function toCSV(rows){ return rows.map(r => r.map(csvCell).join(',')).join('\r\n'); }

function exportData(kind){
  if (kind === 'json'){
    download('chair-and-comb-backup-'+todayISO()+'.json', JSON.stringify({version:1, exportedAt:new Date().toISOString(), settings:S.settings,
      customers:S.customers, services:S.services, products:S.products, appts:S.appts, notes:S.notes, msgs:S.msgs}, null, 2), 'application/json');
  } else if (kind === 'clients'){
    const rows = [['First','Last','Phone','Email','Birthday','Address','Preferred contact','Added','Visits','Total spent','Last visit','Next visit','Hair type','Formula','Allergies']];
    S.customers.forEach(c => { const h = c.hair||{}, lv = lastVisit(c.id), nv = nextVisit(c.id);
      rows.push([c.first,c.last,c.phone,c.email,c.dob,c.address,c.contactPref, c.createdAt?iso(new Date(c.createdAt)):'',
        custAppts(c.id).filter(COUNTED).length, custSpend(c.id).toFixed(2), lv?lv.date:'', nv?nv.date:'', h.type, h.formula, h.allergies]); });
    download('clients-'+todayISO()+'.csv', toCSV(rows), 'text/csv');
  } else {
    const rows = [['Date','Time','Client','Phone','Services','Duration (min)','Status','Service total','Products','Discount','Tip','Total','Deposit','Deposit method','Method','Payment','Notes']];
    S.appts.slice().sort((a,b) => a.date.localeCompare(b.date) || a.start-b.start).forEach(a => {
      const c = cust(a.customerId)||{}, p = a.payment||{};
      rows.push([a.date, fmtTime(a.start), fullName(c), c.phone, serviceNames(a), apptDuration(a), statusLabel(a.status),
        apptServiceTotal(a).toFixed(2), apptProductTotal(a).toFixed(2), (p.discount||0), (p.tip||0), apptTotal(a).toFixed(2),
        (p.deposit||0), p.depositMethod||'', p.method||'', p.status||'unpaid', a.notes||'']); });
    download('appointments-'+todayISO()+'.csv', toCSV(rows), 'text/csv');
  }
  toast('Downloaded');
}

async function importClientsCsv(file){
  toast('Importing clients…');
  try {
    const fd = new FormData(); fd.append('file', file, file.name || 'clients.csv');
    const res = await fetch('/api/customers/import', {method:'POST', body: fd, credentials:'same-origin'});
    if (res.status === 401){ window.location.href = '/login'; return; }
    const r = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(r.error || 'Import failed');
    await loadState(); draw();
    const line = r.added+' added, '+r.updated+' updated'+(r.skipped ? ', '+r.skipped+' skipped' : '')+' of '+r.total;
    if (r.problems && r.problems.length){
      openSheet({title:'Imported with a few problems',
        body:'<p class="small" style="margin-bottom:10px">'+esc(line)+'</p><ul class="small dim" style="padding-left:18px">'+
          r.problems.map(p => '<li>'+esc(p)+'</li>').join('')+'</ul>',
        foot:'<button class="btn primary" data-act="ok">OK</button>',
        onMount(root){ $('[data-act="ok"]', root).onclick = closeSheet; }});
    } else toast('Clients imported — '+line);
  } catch(e){ toast(e.message || 'Could not import that file'); }
}

function importBackup(file){
  const fr = new FileReader();
  fr.onload = () => {
    let data; try { data = JSON.parse(fr.result); } catch(e){ toast('That file isn\'t a valid backup'); return; }
    if (!data || !Array.isArray(data.customers)){ toast('That file isn\'t a valid backup'); return; }
    confirmSheet('Restore this backup?', 'It replaces everything currently in the app: '+data.customers.length+' clients and '+
      ((data.appts||[]).length)+' appointments.', 'Restore', async () => {
      if (data.settings) { S.settings = Object.assign(defaultSettings(), data.settings); saveSettings(); }
      for (const k of COLS){
        const incoming = Array.isArray(data[k]) ? data[k] : [];
        for (const old of S[k].slice()) if (!incoming.some(x => x.id === old.id)) await unpersist(k, old.id);
        S[k] = incoming;
        for (const rec of incoming) await persist(k, rec);
        lsSave(k);
      }
      applyBrand(); draw(); toast('Backup restored');
    });
  };
  fr.readAsText(file);
}

/* ---------- .ics export ---------- */
function icsStamp(dateISO_, mins){
  const d = fromISO(dateISO_); d.setMinutes(mins);
  return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(d.getHours())+pad2(d.getMinutes())+'00';
}
function icsFor(list){
  const b = S.settings.biz;
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Chair and Comb//EN','CALSCALE:GREGORIAN'];
  list.forEach(a => {
    const c = cust(a.customerId) || {};
    const desc = [serviceNames(a), c.phone ? 'Phone: '+c.phone : '', a.notes || ''].filter(Boolean).join('\\n');
    lines.push('BEGIN:VEVENT','UID:'+a.id+'@chairandcomb',
      'DTSTAMP:'+icsStamp(todayISO(), nowMins()),
      'DTSTART:'+icsStamp(a.date, a.start), 'DTEND:'+icsStamp(a.date, apptEnd(a)),
      'SUMMARY:'+fullName(c)+' — '+serviceNames(a),
      'DESCRIPTION:'+desc,
      b.address ? 'LOCATION:'+b.address : 'LOCATION:',
      'STATUS:'+(a.status === 'cancelled' ? 'CANCELLED' : 'CONFIRMED'), 'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

      '<textarea class="inp" name="notes" placeholder="Wants to go two shades lighter. Bring the toner.">'+esc(a.notes||'')+'</textarea></label>';

  openSheet({
    title: id ? 'Edit appointment' : 'New appointment',
    body,
    foot:'<button class="btn ghost" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">'+(id?'Save changes':'Book it')+'</button>',
    onMount(root){
      const sumEl = $('#summary', root), slotsEl = $('#slots', root);
      const readTime = () => { const v = $('[name="start"]', root).value || '10:00'; const [h,m] = v.split(':').map(Number); return h*60+m; };

      function calc(){
        live.date = $('[name="date"]', root).value || todayISO();
        live.start = readTime();
        live.customerId = $('[name="customerId"]', root).value;
        const dur = Number($('[name="duration"]', root).value) ||
          live.sel.map(svc).filter(Boolean).reduce((t,s) => t + (Number(s.duration)||0), 0) || 60;
        const po = $('[name="priceOverride"]', root).value;
        const price = po !== '' ? Number(po) : live.sel.map(svc).filter(Boolean).reduce((t,s) => t + (Number(s.price)||0), 0);
        const disc = Math.max(0, Number($('[name="discount"]', root).value)||0);
        const dep = Math.max(0, Number($('[name="deposit"]', root).value)||0);
        const total = Math.max(0, price - disc);
        $('#depmethod', root).hidden = !dep;
        const probe = {id: a.id || '_new', date: live.date, start: live.start, duration: dur, serviceIds: live.sel};
        const clash = conflictsFor(probe);
        const h = dayHours(live.date);
        const outside = !h.open || live.start < h.start || live.start + dur > h.end;

        sumEl.innerHTML =
          '<div class="spread"><span class="small dim">Ends</span><span class="num">'+fmtTime(live.start + dur)+'</span></div>'+
          '<div class="spread" style="margin-top:4px"><span class="small dim">Duration</span><span class="num">'+dur+' min</span></div>'+
          (disc ? '<div class="spread" style="margin-top:4px"><span class="small dim">Services</span><span class="num">'+money(price)+'</span></div>'+
                  '<div class="spread" style="margin-top:4px"><span class="small dim">Discount</span><span class="num">−'+money(disc)+'</span></div>' : '')+
          '<div class="spread" style="margin-top:4px"><span class="small dim">Total</span><span class="num" style="color:var(--brass);font-size:1.15rem">'+money(total)+'</span></div>'+
          (dep ? '<div class="spread" style="margin-top:4px"><span class="small dim">Deposit paid</span><span class="num">−'+money(dep)+'</span></div>'+
                 '<div class="spread" style="margin-top:4px"><span class="small dim">Due at the appointment</span><span class="num" style="font-weight:700">'+money(Math.max(0, total - dep))+'</span></div>' : '')+
          (disc > price ? '<p class="err" style="margin-top:6px">The discount is more than the price.</p>' : '')+
          (clash.length ? '<p class="err" style="margin-top:8px">Overlaps '+esc(fullName(cust(clash[0].customerId)))+' at '+fmtTime(clash[0].start)+'</p>' : '')+
          (outside ? '<p class="err" style="margin-top:6px">'+(h.open ? 'Outside your hours that day ('+fmtTime(h.start)+'–'+fmtTime(h.end)+')' : 'You\'re marked closed that day')+'</p>' : '');

        const free = freeSlots(live.date, dur).slice(0, 14);
        slotsEl.innerHTML = free.length
          ? '<span class="lab">Open slots that day</span><div class="picks">'+free.map(m =>
              '<button class="pick" data-slotpick="'+m+'" aria-pressed="'+(m===live.start)+'">'+fmtTime(m)+'</button>').join('')+'</div>'
          : '<p class="tiny dim">No free slots that day at this length.</p>';
        $$('[data-slotpick]', slotsEl).forEach(b => b.onclick = () => {
          const m = Number(b.dataset.slotpick);
          $('[name="start"]', root).value = pad2(Math.floor(m/60))+':'+pad2(m%60);
          calc();
        });
      }

      $$('[data-sv]', root).forEach(b => b.onclick = () => {
        const sid = b.dataset.sv;
        live.sel = live.sel.includes(sid) ? live.sel.filter(x => x !== sid) : live.sel.concat([sid]);
        b.setAttribute('aria-pressed', live.sel.includes(sid));
        calc();
      });
      ['date','start','duration','priceOverride','customerId'].forEach(n => {
        const el = $('[name="'+n+'"]', root); if (el) el.addEventListener('change', calc);
      });
      ['discount','deposit'].forEach(n => $('[name="'+n+'"]', root).addEventListener('input', calc));
      let depMethod = (a.payment||{}).depositMethod || '';
      $$('[data-dm]', root).forEach(b => b.onclick = () => {
        depMethod = depMethod === b.dataset.dm ? '' : b.dataset.dm;
        $$('[data-dm]', root).forEach(x => x.setAttribute('aria-pressed', x.dataset.dm === depMethod));
      });
      $('#newcust', root).onclick = () => customerForm(null, rec => {
        const sel = $('[name="customerId"]', root);
        sel.insertAdjacentHTML('beforeend', '<option value="'+rec.id+'">'+esc(fullName(rec))+'</option>');
        sel.value = rec.id; live.customerId = rec.id; calc();
      });
      calc();

      $('[data-act="cancel"]', root).onclick = closeSheet;
      $('[data-act="save"]', root).onclick = () => {
        const sel = $('[name="customerId"]', root);
        if (!sel.value){ sel.classList.add('bad'); toast('Choose a client first'); return; }
        if (!live.sel.length && !$('[name="priceOverride"]', root).value){
          toast('Pick a service, or set a price'); return;
        }
        const wasStatus = a.status;
        const dep = Math.max(0, Number($('[name="deposit"]', root).value)||0);
        const payment = Object.assign({}, a.payment, {
          discount: Math.max(0, Number($('[name="discount"]', root).value)||0),
          deposit: dep,
          depositMethod: dep ? depMethod : ''
        });
        const rec = Object.assign(a, {
          payment,
          id: a.id || uid(),
          customerId: sel.value,
          serviceIds: live.sel,
          date: $('[name="date"]', root).value,
          start: readTime(),
          duration: Number($('[name="duration"]', root).value) || 0,
          priceOverride: $('[name="priceOverride"]', root).value === '' ? null : Number($('[name="priceOverride"]', root).value),
          status: $('[name="status"]', root).value,
          notes: $('[name="notes"]', root).value.trim(),
          createdAt: a.createdAt || Date.now()
        });
        if (!rec.duration) delete rec.duration;
        upsert('appts', rec);
        closeSheet();
        draw();
        const c = cust(rec.customerId);
        if (!id && S.settings.notify.confirm && c && (c.phone || c.email) && rec.status !== 'completed'){
          toast('Booked — confirmation on its way');
        } else if (rec.status === 'completed' && wasStatus !== 'completed'){
          setTimeout(() => paymentSheet(rec.id), 320);
        } else {
          toast(id ? 'Appointment updated' : 'Appointment booked');
        }
      };
    }
  });
}

  const body =

      '<span class="grow"><span class="nm">'+esc(fullName(c))+'</span>'+
      (c && c.phone ? '<span class="tiny dim" style="display:block">'+esc(c.phone)+'</span>' : '')+'</span>'+svg('chev')+'</button>'+
    '<hr class="rule">'+
    '<dl class="kv">'+
      '<dt>When</dt><dd>'+fmtDate(a.date,'long')+'<br>'+fmtTime(a.start)+' – '+fmtTime(apptEnd(a))+'</dd>'+
      '<dt>Services</dt><dd>'+esc(serviceNames(a))+'</dd>'+
      '<dt>Duration</dt><dd>'+apptDuration(a)+' min</dd>'+
      '<dt>Service total</dt><dd>'+money(apptServiceTotal(a))+'</dd>'+

      (COUNTED(a) ? '<dt>Charged</dt><dd style="color:var(--brass)">'+money(apptTotal(a))+' · '+(p.status==='paid'?esc(p.method||'Paid'):'Unpaid')+'</dd>' : '')+
    '</dl>'+
    (a.notes ? '<div class="note" style="margin-top:14px"><div class="meta">Appointment note</div><p>'+esc(a.notes)+'</p></div>' : '')+
    (function(){
      const pics = S.photos.filter(p => p.apptId === a.id);
      const pair = visitPairs(a.customerId).find(g => g.apptId === a.id);

      if (pair) h += pairCard(pair, a.customerId);
      const others = pics.filter(p => !pair || (p.id !== (pair.before||{}).id && p.id !== (pair.after||{}).id));
      if (others.length) h += '<div class="pgrid" style="margin-bottom:6px">'+others.map(photoCell).join('')+'</div>';
      return h;
    })()+
    '<hr class="rule"><span class="lab">Status</span>'+
    '<div class="picks">'+STATUSES.map(s => '<button class="pick" data-setstatus="'+a.id+'|'+s.id+'" aria-pressed="'+(a.status===s.id)+'">'+s.label+'</button>').join('')+'</div>'+
    '<hr class="rule"><div class="picks">'+
      '<button class="btn sm ghost" data-editappt="'+a.id+'">'+svg('edit')+'Edit</button>'+
      (c && c.phone ? '<button class="btn sm ghost" data-msg="'+a.id+'|sms">'+svg('send')+'Text</button>' : '')+
      (c && c.email ? '<button class="btn sm ghost" data-msg="'+a.id+'|email">'+svg('mail')+'Email</button>' : '')+
      '<button class="btn sm ghost" data-addnote="'+a.customerId+'" data-appt-note="'+a.id+'">'+svg('plus')+'Note</button>'+
      '<button class="btn sm ghost" data-addphoto="'+a.customerId+'" data-appt-photo="'+a.id+'">'+svg('plus')+'Photo from library</button>'+
      '<button class="btn sm ghost" data-ics="'+a.id+'">'+svg('dl')+'Add to phone calendar</button>'+
      (COUNTED(a) ? '<button class="btn sm ghost" data-pay="'+a.id+'">'+svg('cash')+'Payment</button>' : '')+
      '<button class="btn sm danger" data-delappt="'+a.id+'">'+svg('trash')+'Delete</button>'+
    '</div>';
  openSheet({title: fmtDate(a.date,'rel')+' · '+fmtTime(a.start), body,

}

function setStatus(id, status){
  const a = byId('appts', id); if (!a) return;
  const was = a.status;
  a.status = status;
  upsert('appts', a);
  closeAllSheets(); draw();
  const c = cust(a.customerId);
  if (status === 'completed' && was !== 'completed'){ toast('Completed — take payment'); setTimeout(() => paymentSheet(id), 300); return; }
  if (status === 'cancelled' && was !== 'cancelled' && c && (c.phone || c.email)){ toast('Cancelled — client notified'); return; }
  toast(statusLabel(status));
}

/* ---------- payment ---------- */
function paymentSheet(id){
  const a = byId('appts', id); if (!a) return;
  const p = Object.assign({discount:0, tip:0}, a.payment || {});
  /* first checkout: the server sends blanks, so start from Cash and received */
  if (!p.paidAt){ p.method = p.method || 'Cash'; p.status = 'paid'; }
  const prods = (a.products || []).slice();
  const sTotal = apptServiceTotal(a);
  const dep = Number(p.deposit)||0;

  const body =
    '<div class="card pad" style="background:var(--mist);box-shadow:none;margin-bottom:16px">'+
      '<div class="spread"><span class="small dim">Services</span><span class="num">'+money(sTotal)+'</span></div>'+
      '<div class="spread" style="margin-top:4px"><span class="small dim">Products</span><span class="num" id="pt">'+money(0)+'</span></div>'+
      '<div class="spread" style="margin-top:8px"><span style="font-weight:700">Total</span><span class="num" id="tt" style="font-size:1.4rem;color:var(--brass)">'+money(sTotal)+'</span></div>'+
      (dep ? '<div class="spread" style="margin-top:4px"><span class="small dim">Deposit paid'+(p.depositMethod ? ' · '+esc(p.depositMethod) : '')+'</span><span class="num">−'+money(dep)+'</span></div>'+
             '<div class="spread" style="margin-top:4px"><span style="font-weight:700">Due now</span><span class="num" id="due" style="font-weight:700">'+money(sTotal)+'</span></div>' : '')+
    '</div>'+
    '<span class="lab">Products sold</span>'+
    (S.products.length ? '<div class="picks" style="margin-bottom:14px">'+S.products.map(pr =>
        '<button class="pick" data-pp="'+pr.id+'" aria-pressed="'+prods.some(x => x.productId===pr.id)+'">'+esc(pr.name)+' · '+money(pr.price)+'</button>').join('')+'</div>'
      : '<p class="tiny dim" style="margin-bottom:14px">No products in stock yet.</p>')+
    (function(){
      const cps = liveCoupons(a.customerId, a.id);
      if (!cps.length) return '';
      return '<span class="lab">Coupon</span>' + cps.map(cp =>
        '<button class="item" data-coupon="'+cp.id+'" style="border:1.5px dashed var(--brass);border-radius:12px;margin-bottom:12px;background:color-mix(in srgb,var(--brass) 8%,transparent)">'+
          '<span style="font-size:1.2rem">\u{1F382}</span>'+
          '<span class="grow"><span class="nm small">'+couponOff(cp)+' · '+esc(cp.code)+'</span>'+
          '<span class="tiny dim" style="display:block">Birthday coupon · until '+fmtDate(cp.expiresOn)+(cp.note ? ' · '+esc(cp.note) : '')+'</span></span>'+
          '<span class="chip" data-couponstate>Apply</span></button>').join('');
    })()+
    '<div class="grid2">'+
      '<label class="field"><span class="lab">Discount</span><input class="inp" name="discount" type="number" inputmode="decimal" min="0" step="1" value="'+(p.discount||0)+'"></label>'+
      '<label class="field"><span class="lab">Tip</span><input class="inp" name="tip" type="number" inputmode="decimal" min="0" step="1" value="'+(p.tip||0)+'"></label>'+
    '</div>'+
    '<span class="lab">Paid with</span><div class="picks" style="margin-bottom:14px">'+
      PAY_METHODS.map(m => '<button class="pick" data-pm="'+m+'" aria-pressed="'+(p.method===m)+'">'+m+'</button>').join('')+'</div>'+
    '<label class="check"><input type="checkbox" name="paid"'+(p.status==='paid'?' checked':'')+'>'+
      '<span style="font-weight:600">Payment received</span></label>';

  openSheet({
    title:'Take payment',
    body,
    foot:'<button class="btn ghost" data-act="cancel">Cancel</button><button class="btn primary" data-act="save">Save payment</button>',
    onMount(root){
      let method = p.method;
      /* a coupon already spent on this appointment starts out applied */
      let couponId = ((S.coupons||[]).find(cp => cp.apptId === a.id && cp.redeemedAt) || {}).id || null;
      const originalCoupon = couponId;
      const paintCoupons = () => $$('[data-coupon]', root).forEach(b => {
        const on = b.dataset.coupon === couponId;
        const chip = $('[data-couponstate]', b);
        chip.textContent = on ? 'Applied' : 'Apply';
        chip.className = 'chip' + (on ? ' st-completed' : '');
      });
      $$('[data-coupon]', root).forEach(b => b.onclick = () => {
        const cp = (S.coupons||[]).find(x => x.id === b.dataset.coupon);
        const dInp = $('[name="discount"]', root);
        if (couponId === cp.id){ couponId = null; dInp.value = 0; }
        else {
          couponId = cp.id;
          const pt = prods.reduce((t,x) => t + x.price*x.qty, 0);
          const off = cp.type === 'amount' ? Math.min(Number(cp.value), sTotal + pt) : Math.round(sTotal * Number(cp.value)) / 100;
          dInp.value = Math.round(off * 100) / 100;
        }
        paintCoupons(); recalc();
      });
      paintCoupons();
      const recalc = () => {
        const pt = prods.reduce((t,x) => t + x.price*x.qty, 0);
        const d = Number($('[name="discount"]', root).value)||0, ti = Number($('[name="tip"]', root).value)||0;
        $('#pt', root).textContent = money(pt);
        const tt = Math.max(0, sTotal + pt - d + ti);
        $('#tt', root).textContent = money(tt);
        if (dep) $('#due', root).textContent = money(Math.max(0, tt - dep));
      };
      $$('[data-pp]', root).forEach(b => b.onclick = () => {
        const pr = byId('products', b.dataset.pp);
        const i = prods.findIndex(x => x.productId === pr.id);
        if (i >= 0) prods.splice(i,1); else prods.push({productId:pr.id, name:pr.name, price:Number(pr.price)||0, qty:1});
        b.setAttribute('aria-pressed', prods.some(x => x.productId === pr.id));
        recalc();
      });
      $$('[data-pm]', root).forEach(b => b.onclick = () => {
        method = b.dataset.pm;
        $$('[data-pm]', root).forEach(x => x.setAttribute('aria-pressed', x.dataset.pm === method));
      });
      ['discount','tip'].forEach(n => $('[name="'+n+'"]', root).addEventListener('input', recalc));
      recalc();
      $('[data-act="cancel"]', root).onclick = closeSheet;
      $('[data-act="save"]', root).onclick = async () => {
        /* settle the coupon with the server first: if the code was already
           spent somewhere else, nothing gets saved and nothing double-counts */
        if (couponId !== originalCoupon){
          const btn = $('[data-act="save"]', root);
          btn.disabled = true;
          try {
            await flushOutbox();
            if (originalCoupon){
              const r = await api('/api/coupons/'+originalCoupon, {method:'PATCH', body: JSON.stringify({apptId:null})});
              S.coupons = S.coupons.map(x => x.id === r.id ? r : x);
            }
            if (couponId){
              const r = await api('/api/coupons/'+couponId, {method:'PATCH', body: JSON.stringify({apptId:a.id})});
              S.coupons = S.coupons.map(x => x.id === r.id ? r : x);
            }
          } catch(e){
            btn.disabled = false;
            if (String(e.message) !== 'signed out') toast(e.message);
            return;
          }
        }
        const before = (a.products||[]).map(x => x.productId);
        a.products = prods;
        a.payment = Object.assign({}, a.payment, { discount:Number($('[name="discount"]', root).value)||0, tip:Number($('[name="tip"]', root).value)||0,
          method, status: $('[name="paid"]', root).checked ? 'paid' : 'unpaid', paidAt: Date.now() });
        if (a.status !== 'completed') a.status = 'completed';
        upsert('appts', a);
        prods.forEach(x => { if (!before.includes(x.productId)){ const pr = byId('products', x.productId);
          if (pr){ pr.qty = Math.max(0, (Number(pr.qty)||0) - x.qty); upsert('products', pr); } } });
        closeAllSheets(); draw(); toast(couponId && couponId !== originalCoupon ? 'Payment recorded — coupon used' : 'Payment recorded');
      };
    }
  });
}

/* ---------- messaging ---------- */
function messageSheet(c, a, kind, forceChannel){
  if (!c) return;
  const st = S.settings, tpl = st.tpl;
  const whenText = (kind === 'night' || kind === 'r24') ? 'tomorrow' : kind === 'r2' ? 'in a couple of hours' : 'soon';
  const vars = tplVars(c, a, {when: whenText});
  const base = {confirm:'confirm', night:'night', dayof:'dayof', r2:'dayof', r24:'night', birthday:'birthday',
    reschedule:'reschedule', cancel:'cancel', rebook:'rebook', followup:'rebook'}[kind] || 'confirm';
  const smsKey = base + '_sms';
  const emKey  = base + '_email';
  const subjKey = emKey + '_subject';
  const emailFirst = ['night','rebook','followup'].includes(kind);
  const textable = canText(c);
  let channel = forceChannel || (emailFirst && c.email ? 'email' : (textable ? 'sms' : 'email'));
  if (channel === 'sms' && !textable) channel = 'email';
  if (channel === 'email' && !c.email) channel = 'sms';

  function bodyFor(ch){
    return tidyMsg(ch === 'sms' ? render(tpl[smsKey], vars) : render(tpl[emKey], vars));
  }
  const titles = {confirm:'Send confirmation', night:'Night-before email', r24:'Send reminder', r2:'Send reminder',
    reschedule:'Tell them it moved', cancel:'Send cancellation', followup:'Invite them back', rebook:'Time to rebook'};

  openSheet({
    title: titles[kind] || 'Send a message',
    body:
      '<div class="row" style="margin-bottom:14px">'+avatar(c,'sm')+'<span class="grow small"><strong>'+esc(fullName(c))+'</strong>'+
        '<span class="tiny dim" style="display:block">'+esc(c.phone||'')+(c.phone&&c.email?' · ':'')+esc(c.email||'')+'</span></span></div>'+
      '<div class="seg" style="margin-bottom:14px">'+
        '<button data-ch="sms" aria-pressed="'+(channel==='sms')+'"'+(textable?'':' disabled style="opacity:.4"')+'>Text</button>'+
        '<button data-ch="email" aria-pressed="'+(channel==='email')+'"'+(c.email?'':' disabled style="opacity:.4"')+'>Email</button></div>'+
      (!textable && c.phone ? '<p class="tiny dim" style="margin:-6px 0 12px">Texting is off: '+esc(textStatus(c).label.toLowerCase())+'.</p>' : '')+
      '<label class="field" id="subjwrap" style="'+(channel==='email'?'':'display:none')+'"><span class="lab">Subject</span>'+
        '<input class="inp" name="subject" value="'+esc(render(tpl[subjKey], vars))+'"></label>'+
      '<label class="field"><span class="lab">Message</span>'+
        '<textarea class="inp" name="body" style="min-height:170px">'+esc(bodyFor(channel))+'</textarea></label>'+
      '<p class="tiny dim">Sent straight from '+(channel === 'email' ? 'your salon email address' : 'your salon number')+'.</p>',
    foot:'<button class="btn ghost" data-act="cancel">Cancel</button><button class="btn primary" data-act="send">'+svg('send')+'Send now</button>',
    onMount(root){
      const ta = $('[name="body"]', root);
      $$('[data-ch]', root).forEach(b => b.onclick = () => {
        if (b.hasAttribute('disabled')) return;
        channel = b.dataset.ch;
        $$('[data-ch]', root).forEach(x => x.setAttribute('aria-pressed', x.dataset.ch === channel));
        $('#subjwrap', root).style.display = channel === 'email' ? '' : 'none';
        ta.value = bodyFor(channel);
      });
      $('[data-act="cancel"]', root).onclick = () => { sendQueue = []; closeSheet(); };
      const btn = $('[data-act="send"]', root);
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = 'Sending…';
        try {
          await api('/api/messages/send', {method:'POST', body: JSON.stringify({
            customerId: c.id, apptId: a ? a.id : null, kind, channel,
            subject: channel === 'email' ? $('[name="subject"]', root).value : '',
            body: ta.value
          })});
          await loadState();
          closeAllSheets(); draw();
          if (sendQueue.length){ toast('Sent — '+sendQueue.length+' to go'); setTimeout(nextInQueue, 340); }
          else toast(channel === 'email' ? 'Email sent' : 'Text sent');
        } catch(e){
          if (String(e.message) === 'signed out') return;
          toast(e.message);
          btn.disabled = false; btn.innerHTML = svg('send')+'Send now';
        }
      };
    }
  });
}

/* ---------- working through the queue ---------- */
let sendQueue = [];
function startSendAll(){
  sendQueue = dueReminders().map(r => ({apptId: r.a ? r.a.id : null, custId: r.c.id, kind: r.kind}));
  if (!sendQueue.length){ toast('Nothing due'); return; }
  nextInQueue();
}
function nextInQueue(){
  const job = sendQueue.shift();
  if (!job) return;
  const c = cust(job.custId);
  if (!c) return nextInQueue();
  messageSheet(c, job.apptId ? byId('appts', job.apptId) : null, job.kind);
}

/* ============================================================
   Event wiring
   ============================================================ */
document.addEventListener('click', e => {
  const t = e.target;
  const hit = sel => t.closest('['+sel+']');
  let el;

  if ((el = hit('data-new'))){
    const k = el.dataset.new;
    if (k === 'cust') customerForm(null);
    else if (k === 'svc') serviceForm(null);
    else if (k === 'prod') productForm(null);
    else if (k === 'appt') apptForm(null, Object.assign({},
      el.dataset.cust ? {customerId: el.dataset.cust} : {},
      el.dataset.date ? {date: el.dataset.date} : {}));
    return;
  }
  if ((el = hit('data-stat'))){
    const k = el.dataset.stat;
    if (k === 'upcoming') upcomingSheet();
    else go(k);
    return;
  }
  if ((el = hit('data-appt'))){ apptSheet(el.dataset.appt); return; }
  if ((el = hit('data-cust'))){ custTab = 'overview'; go('customer', el.dataset.cust); return; }
  if ((el = hit('data-editcust'))){ customerForm(el.dataset.editcust); return; }
  if ((el = hit('data-delcust'))){
    const id = el.dataset.delcust, c = cust(id);
    confirmSheet('Delete '+fullName(c)+'?', 'Their notes and appointment history go too. This can\'t be undone.', 'Delete', () => {
      S.appts.filter(a => a.customerId === id).forEach(a => remove('appts', a.id));
      S.notes.filter(n => n.customerId === id).forEach(n => remove('notes', n.id));
      remove('customers', id); toast('Client deleted'); go('customers');
    }, true); return;
  }
  if ((el = hit('data-custtab'))){ custTab = el.dataset.custtab; draw(); return; }
  if ((el = hit('data-sort'))){ custSort = el.dataset.sort; draw(); return; }
  if ((el = hit('data-svc'))){ serviceForm(el.dataset.svc); return; }
  if ((el = hit('data-prod'))){ productForm(el.dataset.prod); return; }
  if (hit('data-seed')){ seedServices(); return; }
  if ((el = hit('data-calmode'))){ calMode = el.dataset.calmode; draw(); return; }
  if ((el = hit('data-calnav'))){
    const d = Number(el.dataset.calnav);
    if (d === 0) calDate = todayISO();
    else if (calMode === 'day') calDate = addDays(calDate, d);
    else if (calMode === 'week') calDate = addDays(calDate, 7*d);
    else { const x = fromISO(calDate); x.setDate(1); x.setMonth(x.getMonth()+d); calDate = iso(x); }
    draw(); return;
  }
  if ((el = hit('data-calday'))){
    const day = el.dataset.calday;
    if (calMode === 'month' && day !== calDate){
      /* first tap picks the day and shows it under the grid; a second tap opens it */
      calDate = day; draw();
      const dl = $('#daylist');
      if (dl){ const r = dl.getBoundingClientRect(); if (r.top > window.innerHeight - 160) dl.scrollIntoView({behavior:'smooth', block:'start'}); }
      return;
    }
    calDate = day; calMode = 'day'; draw(); return;
  }
  if ((el = hit('data-openday'))){ calDate = el.dataset.openday; calMode = 'day'; draw(); return; }
  if ((el = hit('data-goday'))){ calDate = el.dataset.goday; calMode = 'day'; go('calendar'); return; }
  if ((el = hit('data-shoot'))){
    const [cid, tag, apptId] = el.dataset.shoot.split('|');
    shoot(cid, tag, apptId || null);
    return;
  }
  if ((el = hit('data-compare'))){
    const [b, a] = el.dataset.compare.split('|');
    compareSheet(b, a);
    return;
  }
  if ((el = hit('data-addphoto'))){ pickPhotos(el.dataset.addphoto, el.dataset.apptPhoto || null); return; }
  if ((el = hit('data-photo'))){ photoSheet(el.dataset.photo); return; }
  if ((el = hit('data-delphoto'))){
    const id = el.dataset.delphoto;
    confirmSheet('Delete this photo?', 'It goes for good, along with the file.', 'Delete', async () => {
      try {
        await api('/api/photos/'+id, {method:'DELETE'});
        S.photos = S.photos.filter(p => p.id !== id);
        closeAllSheets(); draw(); toast('Photo deleted');
      } catch(e){ if (String(e.message) !== 'signed out') toast(e.message); }
    }, true);
    return;
  }
  if ((el = hit('data-addnote'))){ noteForm(el.dataset.addnote, null, el.dataset.apptNote || null); return; }
  if ((el = hit('data-editnote'))){ const n = byId('notes', el.dataset.editnote); noteForm(n.customerId, n.id); return; }
  if ((el = hit('data-delnote'))){
    const id = el.dataset.delnote;
    confirmSheet('Delete this note?','It won\'t be recoverable.','Delete', () => { remove('notes', id); toast('Note deleted'); draw(); }, true);
    return;
  }
  if ((el = hit('data-setstatus'))){ const [id, st] = el.dataset.setstatus.split('|'); setStatus(id, st); return; }
  if ((el = hit('data-editappt'))){ closeSheet(); apptForm(el.dataset.editappt); return; }
  if ((el = hit('data-delappt'))){
    const id = el.dataset.delappt;
    confirmSheet('Delete this appointment?','Cancelling instead keeps it in the history.','Delete', () => {
      remove('appts', id); closeAllSheets(); toast('Appointment deleted'); draw(); }, true);
    return;
  }
  if ((el = hit('data-pay'))){ closeSheet(); paymentSheet(el.dataset.pay); return; }
  if ((el = hit('data-msg'))){
    const [id, ch] = el.dataset.msg.split('|');
    const a = byId('appts', id);
    messageSheet(cust(a.customerId), a, a.status === 'cancelled' ? 'cancel' : 'confirm', ch);
    return;
  }
  if ((el = hit('data-remind'))){
    sendQueue = [];
    const parts = el.dataset.remind.split('|');
    const a = parts[0] === '-' ? null : byId('appts', parts[0]);
    messageSheet(a ? cust(a.customerId) : cust(parts[2]), a, parts[1]);
    return;
  }
  if (hit('data-sendall')){ startSendAll(); return; }
  if ((el = hit('data-retry'))){
    const m = byId('msgs', el.dataset.retry);
    if (m) messageSheet(cust(m.customerId), m.apptId ? byId('appts', m.apptId) : null, m.kind, m.channel);
    return;
  }
  if (hit('data-logout')){
    confirmSheet('Sign out?', 'You\'ll need your password to get back in.', 'Sign out', async () => {
      await fetch('/api/auth/logout', {method:'POST', credentials:'same-origin'});
      window.location.href = '/login';
    });
    return;
  }
  if ((el = hit('data-followup'))){ messageSheet(cust(el.dataset.followup), null, 'followup'); return; }
  if ((el = hit('data-msgcust'))){ messageSheet(cust(el.dataset.msgcust), nextVisit(el.dataset.msgcust), 'confirm', 'sms'); return; }
  if ((el = hit('data-mailcust'))){ messageSheet(cust(el.dataset.mailcust), nextVisit(el.dataset.mailcust), 'confirm', 'email'); return; }
  if ((el = hit('data-ics'))){
    const a = byId('appts', el.dataset.ics);
    download('appointment-'+a.date+'.ics', icsFor([a]), 'text/calendar');
    toast('Open the file to add it'); return;
  }
  if (hit('data-exporticsall')){
    const list = upcomingAppts();
    if (!list.length){ toast('Nothing upcoming to export'); return; }
    download('appointments-'+todayISO()+'.ics', icsFor(list), 'text/calendar'); toast('Downloaded'); return;
  }
  if ((el = hit('data-export'))){
    if (el.dataset.export === 'csv') exportData('appts'); else exportData(el.dataset.export);
    return;
  }
  if (hit('data-import')){ $('#importfile').click(); return; }
  if (hit('data-importcsv')){ $('#importcsvfile').click(); return; }
  if (hit('data-editbiz')){ bizForm(); return; }
  if ((el = hit('data-hours'))){ hoursForm(Number(el.dataset.hours)); return; }
  if (hit('data-closures')){ closuresForm(); return; }
  if (hit('data-slot')){ slotForm(); return; }
  if (hit('data-templates')){ templatesForm(); return; }
  if ((el = hit('data-rep'))){ repRange = el.dataset.rep; draw(); return; }
  if ((el = hit('data-setheme'))){ setTheme(el.dataset.setheme); return; }
  if (hit('data-asktexts')){ custSort = 'textok'; custQuery = ''; go('customers'); return; }
  if ((el = hit('data-coupontype'))){
    S.settings.coupon = Object.assign({}, S.settings.coupon, {type: el.dataset.coupontype});
    saveSettings(); draw(); return;
  }
  if ((el = hit('data-setpalette'))){
    S.settings.palette = el.dataset.setpalette;
    applyPalette(S.settings.palette); saveSettings(); draw();
    toast(PALETTES[S.settings.palette].label);
    return;
  }
});

function wireView(){
  const q = $('#custq');
  if (q) q.addEventListener('input', () => { custQuery = q.value; $('#custlist').innerHTML = custListHTML(); });
  $$('[data-notifytoggle]').forEach(el => el.addEventListener('change', () => {
    S.settings.notify[el.dataset.notifytoggle] = el.checked; saveSettings();
  }));
  $$('[data-notify]').forEach(el => el.addEventListener('change', () => {
    S.settings.notify[el.dataset.notify] = Number(el.value) || 1; saveSettings();
  }));
  const nh = $('[data-nighthour]');
  if (nh) nh.addEventListener('change', () => { S.settings.nightHour = Number(nh.value); saveSettings(); draw(); });
  const rd = $('[data-rebookdays]');
  if (rd) rd.addEventListener('change', () => {
    S.settings.autoDefaults = Object.assign({}, S.settings.autoDefaults, {rebookDays: clamp(Number(rd.value)||60, 7, 365)});
    saveSettings();
  });
  const bh = $('[data-bdayhour]');
  if (bh) bh.addEventListener('change', () => { S.settings.birthdayHour = Number(bh.value); saveSettings(); });
  $$('[data-couponfield]').forEach(el => el.addEventListener('change', () => {
    const k = el.dataset.couponfield;
    S.settings.coupon = Object.assign({}, S.settings.coupon);
    S.settings.coupon[k] = k === 'on' ? el.checked : k === 'note' ? el.value.trim() : Number(el.value) || 0;
    saveSettings(); draw();
  }));
  const fw = $('[data-followweeks]');
  if (fw) fw.addEventListener('change', () => { S.settings.followupWeeks = Number(fw.value)||6; saveSettings(); });
  const cur = $('[data-currency]');
  if (cur) cur.addEventListener('change', () => { S.settings.currency = cur.value.trim() || '$'; saveSettings(); draw(); });
  const imp = $('#importfile');
  if (imp) imp.addEventListener('change', e => { if (e.target.files[0]) importBackup(e.target.files[0]); e.target.value = ''; });
  const impc = $('#importcsvfile');
  if (impc) impc.addEventListener('change', e => { if (e.target.files[0]) importClientsCsv(e.target.files[0]); e.target.value = ''; });
  if (route === 'calendar' && calMode !== 'month') wireDrag();
  if (route === 'calendar' && calMode !== 'month'){
    const body = $('.gc-body');
    if (body){ const lo = Number($('.grid-cal').dataset.lo); body.scrollTop = Math.max(0, ((nowMins()-60-lo)/60)*HOUR_PX); }
  }
}

/* ---------- theme & brand ---------- */
function setTheme(t){
  S.settings.theme = t; saveSettings();
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  draw();
}
function applyBrand(){
  applyPalette(S.settings.palette);
  const n = (S.settings.biz.name || 'Maria Hair').trim();
  $('#brandname').textContent = n;
  const letter = (n[0] || 'C').toUpperCase();
  $('#brandmark').textContent = letter; $('#mbrand').textContent = letter;
  document.title = n + ' — salon manager';
}
$('#themebtn').addEventListener('click', () => {
  const order = ['auto','light','dark'];
  setTheme(order[(order.indexOf(S.settings.theme || 'auto') + 1) % 3]);
  toast('Theme: ' + (S.settings.theme));
});

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  lsLoadAll();
  if (S.settings.theme && S.settings.theme !== 'auto') document.documentElement.setAttribute('data-theme', S.settings.theme);
  applyBrand();
  draw();

  try {
    await loadState();
    if (S.settings.theme && S.settings.theme !== 'auto') document.documentElement.setAttribute('data-theme', S.settings.theme);
    applyBrand();
    draw();
  } catch(e){
    if (String(e.message) !== 'signed out') toast('Can\'t reach the server — showing your last copy');
  }

  if (!S.services.length && !S.customers.length){
    setTimeout(() => {
      if (S.services.length) return;
      openSheet({
        title:'Welcome',
        body:'<p class="small">This runs your chair: clients, bookings, the calendar, takings, and the emails and texts that go with them.</p>'+
          '<p class="small" style="margin-top:10px">Start with a service menu — you can rename, reprice or delete anything afterwards.</p>',
        foot:'<button class="btn ghost" data-act="skip">I\'ll add my own</button><button class="btn primary" data-act="seed">Use a starter menu</button>',
        onMount(root){
          $('[data-act="skip"]', root).onclick = () => { S.settings.seeded = true; saveSettings(); closeSheet(); };
          $('[data-act="seed"]', root).onclick = () => { closeSheet(); seedServices(); };
        }
      });
    }, 600);
  }

  /* keep the clock honest, and pick up anything done on another device */
  setInterval(() => { if (route === 'dashboard' || route === 'calendar') draw(); }, 120000);
  setInterval(() => {
    if (sheetStack.length) return;
    loadState().then(draw).catch(() => {});
  }, 300000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !sheetStack.length) loadState().then(draw).catch(() => {});
  });
  window.addEventListener('online', flushOutbox);
})();
</script>
